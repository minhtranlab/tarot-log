<style>
/* Layout: one narrow column built for a phone. Question and spread settings on top, a table of dashed empty slots below that cards get dealt into one by one from a deck pile above the Draw bar, a history sheet, and a card viewer that grows out of the tapped card and flips to its meaning. */
:root {
  --bg: #eceaf1;
  --surface: #f8f7fb;
  --line: #cfcbdb;
  --fg: #1d1a2e;
  --muted: #615b78;
  --accent: #8a5b00;
  --accent-fg: #fffaf0;
  --rev: #b3392a;
  --scrim: rgba(20, 17, 34, .88);
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14121c; --surface: #1e1b2b; --line: #373249; --fg: #ece6d8; --muted: #a29bb4;
    --accent: #dba843; --accent-fg: #1a1408; --rev: #ee7d69; --scrim: rgba(8, 6, 14, .92);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14121c; --surface: #1e1b2b; --line: #373249; --fg: #ece6d8; --muted: #a29bb4;
  --accent: #dba843; --accent-fg: #1a1408; --rev: #ee7d69; --scrim: rgba(8, 6, 14, .92);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5; padding-inline: 16px; padding-block: 18px 120px; }
.wrap { max-width: 640px; margin-inline: auto; display: grid; gap: 18px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 2.2rem; line-height: 1; margin: 0; letter-spacing: .01em; }
.sub { color: var(--muted); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; margin: 6px 0 0; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .flip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.ctl { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; }
.ctl input.q { width: 100%; height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding-inline: 12px; }
.ctl input.q::placeholder, .grp input.name::placeholder, .hn::placeholder { color: var(--muted); opacity: .8; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.row label, .row .lbl { font-weight: 500; }
select { height: 40px; min-width: 0; max-width: 64%; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding-inline: 10px; }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 1.3rem; line-height: 1; }
.step output { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
.switch { position: relative; width: 50px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 14px; background: var(--line); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); transition: transform .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(22px); background: var(--accent-fg); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

#out { display: grid; gap: 24px; }
.grp h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font-size: 1rem; min-height: 34px; }
.grp .tag { font-family: var(--display); font-weight: 700; font-size: 1.5rem; color: var(--accent); line-height: 1; }
.grp .title { font-family: var(--display); font-weight: 700; font-size: 1.45rem; line-height: 1.1; }
.grp input.name { flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1px dashed var(--line); color: var(--fg); font: inherit; font-weight: 500; padding: 4px 0; border-radius: 0; }
.grp .more { margin-left: auto; flex: none; height: 32px; padding-inline: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: .78rem; font-weight: 700; color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 10px; }
.cards.n4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cards.cross { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.slot { min-width: 0; display: grid; gap: 6px; align-content: start; }
.legend { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-size: .78rem; color: var(--muted); }
.legend b { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-right: 6px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-size: .68rem; }

/* the empty spot, which the dealt card lands on */
.holder { position: relative; width: 100%; aspect-ratio: 350 / 600; border: 1.5px dashed var(--line); border-radius: 8px; display: grid; place-items: center; color: var(--line); font-family: var(--display); font-weight: 700; font-size: 1.8rem; }
.holder.filled { border-color: transparent; }
.badge { position: absolute; top: 4px; left: 4px; z-index: 3; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font: 700 .68rem/18px var(--body); text-align: center; pointer-events: none; }
.card { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: none; display: block; perspective: 900px; border-radius: 8px; }
.card.pending { visibility: hidden; }
.card.ghost { visibility: hidden; }
.cflip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .75s cubic-bezier(.4, .1, .2, 1); }
.cflip.down { transform: rotateY(180deg); transition: none; }
.cface { position: absolute; inset: 0; border-radius: 7px; overflow: hidden; -webkit-backface-visibility: hidden; backface-visibility: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.28); }
.cfront { border: 1px solid var(--line); background: var(--surface); }
.cfront img { width: 100%; height: 100%; display: block; object-fit: cover; }
.card.rv .cfront img { transform: rotate(180deg); }
.slot.jp .cfront { border: 2px dashed var(--accent); }
.slot.xt .cfront { border: 2px solid var(--accent); }
/* card back, drawn in code: deep indigo with a brass lattice and ring */
.cback { background-color: #2a2450; background-image: radial-gradient(circle at 50% 50%, #2a2450 0 11%, #c9a24b 11.5% 13.5%, #2a2450 14% 19%, #c9a24b 19.5% 20.5%, transparent 21%), repeating-linear-gradient(45deg, rgba(201,162,75,.30) 0 1px, transparent 1px 10px), repeating-linear-gradient(-45deg, rgba(201,162,75,.30) 0 1px, transparent 1px 10px); box-shadow: inset 0 0 0 4px #2a2450, inset 0 0 0 5px #c9a24b, 0 2px 8px rgba(0,0,0,.3); }
.cflip .cback { transform: rotateY(180deg); }

.cap { font-size: .74rem; line-height: 1.3; color: var(--muted); overflow-wrap: anywhere; min-height: 1.3em; text-align: center; }
.cap .pos { display: block; color: var(--accent); font-weight: 700; }
.cap .info { opacity: 0; transition: opacity .5s ease; }
.cap.on .info { opacity: 1; }
.jtag { color: var(--accent); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .64rem; }

/* deck pile that cards are dealt from */
.pile { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); width: 50px; aspect-ratio: 350 / 600; transform: translateX(-50%); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 3; }
.pile.on { opacity: 1; }
.pile .cback { position: absolute; inset: 0; border-radius: 6px; }
.pile .cback:nth-child(1) { transform: translate(-3px, 3px); }
.pile .cback:nth-child(2) { transform: translate(-1.5px, 1.5px); }

.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: center; z-index: 2; }
.bar button { height: 50px; border-radius: 10px; font-weight: 700; font-size: .95rem; border: 1px solid var(--line); background: var(--surface); padding-inline: 16px; }
.bar button.go { flex: 1; max-width: 360px; background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-family: var(--display); font-size: 1.4rem; letter-spacing: .04em; }
.bar button:disabled { opacity: .55; cursor: default; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: .85rem; z-index: 30; max-width: 90vw; text-align: center; }

<script>
const CARDS = __CARDS__;
const IMG = __IMGS__;
const src = k => IMG[k] || ('cards/' + k + '.jpg');
/* Jumper tiers out of 10,000, cumulative: under 10 is three (0.1%), under 110 is two (1%), under 1110 is one (10%) */
const JUMP = { three: 10, two: 110, one: 1110 };
const MAX_OPT = 6, MAX_PER = 6, STAGGER = 430, HIST_MAX = 150;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const BY_K = {}; CARDS.forEach((c, i) => { BY_K[c.k] = i; });

/* [English, Vietnamese] for every position */
const SPREADS = {
  compare: { name: 'Compare options' },
  one: { name: 'Single card', pos: [['Card', 'Lá bài']] },
  ppf: { name: 'Past · Present · Future', pos: [['Past', 'Quá khứ'], ['Present', 'Hiện tại'], ['Future', 'Tương lai']] },
  sca: { name: 'Situation · Challenge · Advice', pos: [['Situation', 'Tình huống'], ['Challenge', 'Thách thức'], ['Advice', 'Lời khuyên']] },
  horseshoe: { name: 'Horseshoe', pos: [['Past', 'Quá khứ'], ['Present', 'Hiện tại'], ['Hidden influences', 'Ảnh hưởng ngầm'], ['Obstacles', 'Trở ngại'], ['Others / environment', 'Người xung quanh'], ['Advice', 'Lời khuyên'], ['Outcome', 'Kết quả']] },
  celtic: { name: 'Celtic Cross', pos: [['Present', 'Hiện tại'], ['Challenge (crossing)', 'Thách thức'], ['Foundation', 'Nền tảng'], ['Recent past', 'Quá khứ gần'], ['Crown / goal', 'Mục tiêu'], ['Near future', 'Tương lai gần'], ['Yourself', 'Bản thân'], ['Environment', 'Môi trường'], ['Hopes & fears', 'Hy vọng & nỗi sợ'], ['Outcome', 'Kết quả']] },
};
/* Celtic Cross: position number -> [column, row]. 2 lies across 1; 7 to 10 stand in a column on the right, 7 at the bottom. */
const CROSS = { 1: [2, 2], 2: [2, 2], 3: [2, 3], 4: [1, 2], 5: [2, 1], 6: [3, 2], 7: [4, 4], 8: [4, 3], 9: [4, 2], 10: [4, 1] };

let S = { spread: 'compare', opts: 3, per: 3, rev: true, jump: true, mode: 'draw' };
try { const s = JSON.parse(localStorage.getItem('pocketTarot') || 'null'); if (s) S = Object.assign(S, s); } catch (e) {}
if (!SPREADS[S.spread]) S.spread = 'compare';
S.mode = S.mode === 'enter' ? 'enter' : 'draw';
S.opts = Math.min(MAX_OPT, Math.max(1, +S.opts || 3));
S.per = Math.min(MAX_PER, Math.max(1, +S.per || 3));
function save() { try { localStorage.setItem('pocketTarot', JSON.stringify(S)); } catch (e) {} }

/* Exact uniform integer in [0, n): rejection sampling on 32 random bits, no modulo bias */
function randInt(n) {
  const lim = Math.floor(4294967296 / n) * n, a = new Uint32Array(1);
  let x;
  do { crypto.getRandomValues(a); x = a[0]; } while (x >= lim);
  return x % n;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function jumperCount() {
  if (!S.jump) return 0;
  const r = randInt(10000);
  if (r < JUMP.three) return 3;
  if (r < JUMP.two) return 2;
  if (r < JUMP.one) return 1;
  return 0;
}

let draw = null;   /* null = empty table. Otherwise groups: {o} for compare options or {sp} for a fixed spread, each with cards:[{i, rev, jp, x, pos, n}] */
let labels = [];
let flat = [];     /* every dealt card in reading order */
let thumbs = [];   /* matching thumbnail buttons */
let dealId = 0, dealing = false;
let curId = null, curTs = 0, curNote = '', saved = false;

function makeDraw() {
  const deck = shuffle(CARDS.map((_, i) => i));
  const make = (jp, pos, n) => ({ i: deck.pop(), rev: S.rev && randInt(2) === 0, jp, x: false, pos, n });
  const groups = [];
  if (S.spread === 'compare') {
    for (let o = 0; o < S.opts; o++) {
      const cards = [];
      for (let k = 0; k < S.per; k++) cards.push(make(false, null, 0));
      const j = jumperCount();
      for (let k = 0; k < j; k++) cards.push(make(true, null, 0));
      groups.push({ o, cards });
    }
  } else {
    const cards = SPREADS[S.spread].pos.map((p, k) => make(false, p, k + 1));
    const j = jumperCount();
    for (let k = 0; k < j; k++) cards.push(make(true, null, 0));
    groups.push({ sp: S.spread, cards });
  }
  return groups;
}

/* the empty table for the current settings */
function layout() {
  if (S.spread === 'compare') return Array.from({ length: S.opts }, (_, o) => ({ o, cards: Array.from({ length: S.per }, () => ({ empty: true, pos: null, n: 0 })) }));
  return [{ sp: S.spread, cards: SPREADS[S.spread].pos.map((p, k) => ({ empty: true, pos: p, n: k + 1 })) }];
}

function optName(o) { return (labels[o] && labels[o].trim()) || 'Option ' + String.fromCharCode(65 + o); }
function oriWord(c) { return c.rev ? 'reversed' : 'upright'; }
function spreadTitle(sp) { const n = SPREADS[sp].pos.length; return SPREADS[sp].name + (n > 3 ? ' (' + n + ')' : ''); }

/* mode: 'none' shows every card face up, 'all' deals every card, 'new' deals only cards flagged fresh */
function render(groups, mode) {
  const out = $('out'); out.textContent = '';
  const enter = S.mode === 'enter' && groups === draw;
  flat = []; thumbs = [];
  groups.forEach(g => {
    const sec = document.createElement('section'); sec.className = 'grp';
    const h = document.createElement('h2');
    if (g.o !== undefined) {
      const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = String.fromCharCode(65 + g.o);
      const inp = document.createElement('input'); inp.className = 'name'; inp.id = 'name' + g.o; inp.type = 'text';
      inp.value = labels[g.o] || ''; inp.placeholder = 'Option ' + String.fromCharCode(65 + g.o);
      inp.setAttribute('aria-label', 'Name of option ' + String.fromCharCode(65 + g.o));
      inp.addEventListener('input', () => { labels[g.o] = inp.value; });
      inp.addEventListener('change', () => { if (draw && curId && saved) persistCurrent(); });
      h.append(tag, inp);
    } else {
      const t = document.createElement('span'); t.className = 'title'; t.textContent = spreadTitle(g.sp); h.append(t);
    }
    if (enter) {
      [['Jumper', 'jp'], ['Extra', 'x']].forEach(([lab, key]) => {
        const ab = document.createElement('button'); ab.type = 'button'; ab.className = 'more'; ab.textContent = '+ ' + lab;
        ab.setAttribute('aria-label', 'Add a ' + lab.toLowerCase() + ' slot');
        ab.addEventListener('click', () => { g.cards.push({ empty: true, pos: null, n: 0, [key]: true }); render(draw, 'none'); });
        h.append(ab);
      });
    } else if (draw && groups === draw) {
      const more = document.createElement('button'); more.type = 'button'; more.className = 'more'; more.textContent = '+ Card';
      more.setAttribute('aria-label', 'Draw one more card' + (g.o !== undefined ? ' for ' + optName(g.o) : ''));
      more.hidden = dealing;
      more.addEventListener('click', () => addExtra(g));
      h.append(more);
    }
    sec.append(h);
    const cross = g.sp === 'celtic';
    const grid = document.createElement('div');
    grid.className = 'cards' + (cross ? ' cross' : '') + (!cross && g.o !== undefined && S.per === 4 ? ' n4' : '');
    let extra = 0;
    g.cards.forEach(c => {
      const animate = mode === 'all' || (mode === 'new' && c.fresh);
      const slot = document.createElement('div'); slot.className = 'slot' + (c.jp ? ' jp' : '') + (c.x ? ' xt' : '');
      const holder = document.createElement('div'); holder.className = 'holder';
      const cap = document.createElement('div'); cap.className = 'cap';
      if (cross) {
        if (c.pos) {
          const at = CROSS[c.n]; slot.style.gridColumn = at[0]; slot.style.gridRow = at[1];
          const bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = c.n; holder.append(bd);
          if (c.n === 2) { holder.style.transform = 'rotate(90deg)'; holder.dataset.rot = '90'; slot.style.zIndex = 2; }
        } else { slot.style.gridColumn = (extra % 4) + 1; slot.style.gridRow = 5 + Math.floor(extra / 4); extra++; }
      } else if (c.pos) {
        const ps = document.createElement('span'); ps.className = 'pos'; ps.textContent = c.n + ' · ' + c.pos[1]; cap.append(ps);
      }
      if (c.empty) {
        if (enter) {
          holder.classList.add('tap'); holder.setAttribute('role', 'button'); holder.tabIndex = 0;
          holder.setAttribute('aria-label', 'Choose a card' + (c.pos ? ' for ' + c.pos[0] : ''));
          holder.append(document.createTextNode('+'));
          const go = () => openPicker(g, c);
          holder.addEventListener('click', go);
          holder.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } });
          if (c.jp || c.x) {
            const info = document.createElement('div'); info.className = 'info';
            const jt = document.createElement('span'); jt.className = 'jtag'; jt.textContent = c.jp ? 'Jumper' : 'Extra'; info.append(jt);
            cap.append(info); cap.classList.add('on');
          }
        } else if (c.pos && !cross) holder.append(document.createTextNode(c.n));
      } else {
        const idx = flat.length; flat.push(c); c.o = g.o;
        const d = CARDS[c.i];
        const b = document.createElement('button'); b.type = 'button'; b.className = 'card' + (c.rev ? ' rv' : '') + (animate ? ' pending' : '');
        b.setAttribute('aria-label', d.n + ', ' + oriWord(c) + (c.jp ? ', jumper' : '') + (c.x ? ', extra card' : '') + '. Open');
        b.disabled = !!animate;
        const fl = document.createElement('div'); fl.className = 'cflip' + (animate ? ' down' : '');
        const fr = document.createElement('div'); fr.className = 'cface cfront';
        const im = document.createElement('img'); im.src = src(d.k); im.alt = d.n; fr.append(im);
        const bk = document.createElement('div'); bk.className = 'cface cback';

async function bring(el) {
  const r = el.getBoundingClientRect();
  if (r.top < 12 || r.bottom > innerHeight - 110) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); await sleep(450); }
}

function deal1(i) {
  const b = thumbs[i], inner = b.firstChild, holder = b.parentNode, cap = holder.nextSibling;
  const rot = +(holder.dataset.rot || 0);
  const pr = $('pile').getBoundingClientRect(), t = holder.getBoundingClientRect();
  let dx = (pr.left + pr.width / 2) - (t.left + t.width / 2), dy = (pr.top + pr.height / 2) - (t.top + t.height / 2);
  const s = pr.width / holder.offsetWidth;
  if (rot === 90) { const x = dy, y = -dx; dx = x; dy = y; } /* the holder is turned a quarter, so carry the vector into its frame */
  b.style.zIndex = 5;
  b.classList.remove('pending');
  b.animate([
    { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ') rotate(' + (-9 - rot) + 'deg)' },
    { transform: 'translate(0,0) scale(1) rotate(0deg)' }
  ], { duration: 580, easing: 'cubic-bezier(.2, .8, .25, 1)' });
  setTimeout(() => { inner.classList.remove('down'); holder.classList.add('filled'); }, 340);
  setTimeout(() => { cap.classList.add('on'); b.disabled = false; b.style.zIndex = ''; }, 1000);
}

function lock(on) { dealing = on; $('draw').disabled = on; setMoreHidden(on); }

async function startDraw() {
  if (dealing) return;
  labels = labels.slice(0, S.opts);
  draw = makeDraw();
  curId = newId(); curTs = Date.now(); curNote = ''; saved = false;
  window.scrollTo(0, 0);
  const my = ++dealId; lock(true);
  render(draw, REDUCE ? 'none' : 'all');
  if (REDUCE) { lock(false); setMoreHidden(false); persistCurrent(); return; }
  await Promise.race([preload(flat), sleep(3000)]);
  if (my !== dealId) return;
  $('pile').classList.add('on'); await sleep(250);
  for (let i = 0; i < flat.length; i++) {
    if (my !== dealId) return;
    await bring(thumbs[i].parentNode);
    if (my !== dealId) return;
    deal1(i);
    await sleep(STAGGER);
  }
  await sleep(750);
  if (my !== dealId) return;
  $('pile').classList.remove('on'); lock(false);
  persistCurrent();
}

/* one more card, taken from what is left of the deck, added to the group where its button was tapped */
async function addExtra(g) {
  if (dealing || !draw) return;
  const used = new Set(); draw.forEach(x => x.cards.forEach(c => used.add(c.i)));
  const pool = []; CARDS.forEach((_, i) => { if (!used.has(i)) pool.push(i); });
  if (!pool.length) { toast('The deck is empty'); return; }
  const c = { i: pool[randInt(pool.length)], rev: S.rev && randInt(2) === 0, jp: false, x: true, pos: null, n: 0, fresh: true };
  g.cards.push(c);
  const my = ++dealId; lock(true);
  render(draw, REDUCE ? 'none' : 'new');
  const idx = flat.indexOf(c);
  if (!REDUCE) {
    await Promise.race([preload([c]), sleep(3000)]);
    if (my !== dealId) return;
    $('pile').classList.add('on'); await sleep(250);
    await bring(thumbs[idx].parentNode);
    if (my !== dealId) return;
    deal1(idx);
    await sleep(1300);
    if (my !== dealId) return;
    $('pile').classList.remove('on');
  }
  c.fresh = false; lock(false);
  persistCurrent();
}

const store = {
  mode: 'local', db: null, items: [], ready: false,
  loadLocal() {
    try { const a = JSON.parse(localStorage.getItem('pocketTarotHistory') || '[]'); this.items = Array.isArray(a) ? a : []; } catch (e) { this.items = []; }
  },
  saveLocal() { try { localStorage.setItem('pocketTarotHistory', JSON.stringify(this.items.slice(0, HIST_MAX))); } catch (e) {} },
  toLocal() { this.mode = 'local'; this.loadLocal(); this.ready = true; renderHist(); },
  async init() {
    this.loadLocal();

    if (!db) { this.ready = true; renderHist(); return; }
    this.db = db; this.mode = 'db';
    try {
      db.collection('history').orderBy('ts', 'desc').limit(HIST_MAX).onSnapshot(snap => {
        this.items = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
        this.ready = true; renderHist();
      }, () => { this.toLocal(); });
    } catch (e) { this.toLocal(); }
  },
  async put(id, obj) {
    if (this.mode === 'db') {
      try { await this.db.doc('history/' + id).set(obj); return; } catch (e) { this.toLocal(); }
    }

    this.saveLocal(); renderHist();
  },
  async patch(id, p) {

    }
    this.items = this.items.map(x => x.id === id ? Object.assign({}, x, p) : x);
    this.saveLocal(); renderHist();
  },
  async del(id) {
    if (this.mode === 'db') {
      try { await this.db.doc('history/' + id).delete(); return; } catch (e) { this.toLocal(); }
    }
    this.items = this.items.filter(x => x.id !== id);

  const box = $('pf'); box.textContent = '';
  ARCS.forEach(([k, lab]) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = lab; b.setAttribute('aria-pressed', String(pArc === k));
    b.addEventListener('click', () => { pArc = k; buildChips(); renderPick(); });
    box.append(b);
  });
}
function renderPick() {
  const used = new Set();
  draw.forEach(g => g.cards.forEach(c => { if (!c.empty && c !== pT.c) used.add(c.i); }));
  const q = $('ps').value.trim().toLowerCase();
  const grid = $('pg'); grid.textContent = '';
  CARDS.forEach((d, i) => {
    if (pArc !== 'All' && d.arc !== pArc) return;
    if (q && d.n.toLowerCase().indexOf(q) < 0) return;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pc' + (!pT.c.empty && pT.c.i === i ? ' cur' : '');
    b.disabled = used.has(i); b.setAttribute('aria-label', d.n + (used.has(i) ? ' (already on the table)' : ''));
    const im = document.createElement('img'); im.src = src(d.k); im.alt = '';
    b.append(im, mk('span', '', d.n));
    b.addEventListener('click', () => { pT.c.i = i; pT.c.rev = pRev; delete pT.c.empty; closePick(); render(draw, 'none'); });
    grid.append(b);
  });
  if (!grid.firstChild) grid.append(mk('p', 'mode', 'No card matches.'));
}
function openPicker(g, c) {
  pT = { g, c }; pArc = 'All'; $('ps').value = '';
  const k = g.cards.indexOf(c) + 1;
  $('pt').textContent = c.pos ? c.n + ' · ' + c.pos[0] + ' / ' + c.pos[1] : c.jp ? 'Jumper' : c.x ? 'Extra card' : (g.o !== undefined ? optName(g.o) + ' · card ' + k : 'Choose a card');
  $('prm').textContent = (c.jp || c.x) ? 'Remove this slot' : 'Clear this slot';
  $('prm').hidden = c.empty && !(c.jp || c.x);
  setOri(!!c.rev); buildChips(); renderPick();
  $('pick').hidden = false; $('pick').scrollTop = 0;
}
function closePick() { $('pick').hidden = true; pT = null; }
$('px').onclick = closePick;
$('pUp').onclick = () => setOri(false);
$('pRv').onclick = () => setOri(true);
$('ps').addEventListener('input', () => { if (pT) renderPick(); });
$('prm').onclick = () => {
  const { g, c } = pT;
  if (c.jp || c.x) g.cards.splice(g.cards.indexOf(c), 1);
  else { delete c.i; c.rev = false; c.empty = true; }
  closePick(); render(draw, 'none');
};
$('save').onclick = async () => {
  if (!draw || S.mode !== 'enter') return;
  const miss = draw.reduce((a, g) => a + g.cards.filter(c => c.empty && !c.jp && !c.x).length, 0);
  if (miss) { toast(miss + (miss > 1 ? ' slots' : ' slot') + ' still empty'); return; }
  const e = entryFrom();
  if (!e.groups.some(g => g.cards.length)) { toast('Add cards first'); return; }
  e.note = curNote; saved = true;
  await store.put(curId, e);
  toast('Saved to History');
};

syncCtl();
resetTable();
store.init();
</script>
