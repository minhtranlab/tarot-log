const CROSS = { 1: [2, 2], 2: [2, 2], 3: [2, 3], 4: [1, 2], 5: [2, 1], 6: [3, 2], 7: [4, 4], 8: [4, 3], 9: [4, 2], 10: [4, 1] };

let S = { spread: 'compare', opts: 3, per: 3, rev: true, jump: true, mode: 'draw' };
try { const s = JSON.parse(localStorage.getItem('pocketTarot') || 'null'); if (s) S = Object.assign(S, s); } catch (e) {}
if (!SPREADS[S.spread]) S.spread = 'compare';
S.mode = S.mode === 'enter' ? 'enter' : 'draw';
S.opts = Math.min(MAX_OPT, Math.max(1, +S.opts || 3));
S.per = Math.min(MAX_PER, Math.max(1, +S.per || 3));
function save() { try { localStorage.setItem('pocketTarot', JSON.stringify(S)); } catch (e) {} }

/* Exact uniform integer in [0, n): rejection sampling on 32 random bits, no modulo bias */
function randInt(n) {
  const lim = Math.floor(4294967296 / n) * n, a = new Uint32Array(1);
  let x;
  do { crypto.getRandomValues(a); x = a[0]; } while (x >= lim);
  return x % n;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function jumperCount() {
  if (!S.jump) return 0;
  const r = randInt(10000);
  if (r < JUMP.three) return 3;
  if (r < JUMP.two) return 2;
  if (r < JUMP.one) return 1;
  return 0;
}

let draw = null;   /* null = empty table. Otherwise groups: {o} for compare options or {sp} for a fixed spread, each with cards:[{i, rev, jp, x, pos, n}] */
let labels = [];
let flat = [];     /* every dealt card in reading order */
let thumbs = [];   /* matching thumbnail buttons */
let dealId = 0, dealing = false;
let curId = null, curTs = 0, curNote = '', saved = false;

function makeDraw() {
  const deck = shuffle(CARDS.map((_, i) => i));
  const make = (jp, pos, n) => ({ i: deck.pop(), rev: S.rev && randInt(2) === 0, jp, x: false, pos, n });
  const groups = [];
  if (S.spread === 'compare') {
    for (let o = 0; o < S.opts; o++) {
      const cards = [];
      for (let k = 0; k < S.per; k++) cards.push(make(false, null, 0));
      const j = jumperCount();
      for (let k = 0; k < j; k++) cards.push(make(true, null, 0));
      groups.push({ o, cards });
    }
  } else {
    const cards = SPREADS[S.spread].pos.map((p, k) => make(false, p, k + 1));
    const j = jumperCount();
    for (let k = 0; k < j; k++) cards.push(make(true, null, 0));
    groups.push({ sp: S.spread, cards });
  }
  return groups;
}

/* the empty table for the current settings */
function layout() {
  if (S.spread === 'compare') return Array.from({ length: S.opts }, (_, o) => ({ o, cards: Array.from({ length: S.per }, () => ({ empty: true, pos: null, n: 0 })) }));
  return [{ sp: S.spread, cards: SPREADS[S.spread].pos.map((p, k) => ({ empty: true, pos: p, n: k + 1 })) }];
}

function optName(o) { return (labels[o] && labels[o].trim()) || 'Option ' + String.fromCharCode(65 + o); }
function oriWord(c) { return c.rev ? 'reversed' : 'upright'; }
function spreadTitle(sp) { const n = SPREADS[sp].pos.length; return SPREADS[sp].name + (n > 3 ? ' (' + n + ')' : ''); }

/* mode: 'none' shows every card face up, 'all' deals every card, 'new' deals only cards flagged fresh */
function render(groups, mode) {
  const out = $('out'); out.textContent = '';
  const enter = S.mode === 'enter' && groups === draw;
  flat = []; thumbs = [];
  groups.forEach(g => {
    const sec = document.createElement('section'); sec.className = 'grp';
    const h = document.createElement('h2');
    if (g.o !== undefined) {
      const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = String.fromCharCode(65 + g.o);
      const inp = document.createElement('input'); inp.className = 'name'; inp.id = 'name' + g.o; inp.type = 'text';
      inp.value = labels[g.o] || ''; inp.placeholder = 'Option ' + String.fromCharCode(65 + g.o);
      inp.setAttribute('aria-label', 'Name of option ' + String.fromCharCode(65 + g.o));
      inp.addEventListener('input', () => { labels[g.o] = inp.value; });
      inp.addEventListener('change', () => { if (draw && curId && saved) persistCurrent(); });
      h.append(tag, inp);
    } else {
      const t = document.createElement('span'); t.className = 'title'; t.textContent = spreadTitle(g.sp); h.append(t);
    }
    if (enter) {
      [['Jumper', 'jp'], ['Extra', 'x']].forEach(([lab, key]) => {
        const ab = document.createElement('button'); ab.type = 'button'; ab.className = 'more'; ab.textContent = '+ ' + lab;
        ab.setAttribute('aria-label', 'Add a ' + lab.toLowerCase() + ' slot');
        ab.addEventListener('click', () => { g.cards.push({ empty: true, pos: null, n: 0, [key]: true }); render(draw, 'none'); });
        h.append(ab);
      });
    } else if (draw && groups === draw) {
      const more = document.createElement('button'); more.type = 'button'; more.className = 'more'; more.textContent = '+ Card';
      more.setAttribute('aria-label', 'Draw one more card' + (g.o !== undefined ? ' for ' + optName(g.o) : ''));
      more.hidden = dealing;
      more.addEventListener('click', () => addExtra(g));
      h.append(more);
    }
    sec.append(h);
    const cross = g.sp === 'celtic';
    const grid = document.createElement('div');
    grid.className = 'cards' + (cross ? ' cross' : '') + (!cross && g.o !== undefined && S.per === 4 ? ' n4' : '');
    let extra = 0;
    g.cards.forEach(c => {
      const animate = mode === 'all' || (mode === 'new' && c.fresh);
      const slot = document.createElement('div'); slot.className = 'slot' + (c.jp ? ' jp' : '') + (c.x ? ' xt' : '');
      const holder = document.createElement('div'); holder.className = 'holder';
      const cap = document.createElement('div'); cap.className = 'cap';
      if (cross) {
        if (c.pos) {
          const at = CROSS[c.n]; slot.style.gridColumn = at[0]; slot.style.gridRow = at[1];
          const bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = c.n; holder.append(bd);
          if (c.n === 2) { holder.style.transform = 'rotate(90deg)'; holder.dataset.rot = '90'; slot.style.zIndex = 2; }
        } else { slot.style.gridColumn = (extra % 4) + 1; slot.style.gridRow = 5 + Math.floor(extra / 4); extra++; }
      } else if (c.pos) {
        const ps = document.createElement('span'); ps.className = 'pos'; ps.textContent = c.n + ' · ' + c.pos[1]; cap.append(ps);
      }
      if (c.empty) {
        if (enter) {
          holder.classList.add('tap'); holder.setAttribute('role', 'button'); holder.tabIndex = 0;
          holder.setAttribute('aria-label', 'Choose a card' + (c.pos ? ' for ' + c.pos[0] : ''));
          holder.append(document.createTextNode('+'));
          const go = () => openPicker(g, c);
          holder.addEventListener('click', go);
          holder.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } });
          if (c.jp || c.x) {
            const info = document.createElement('div'); info.className = 'info';
            const jt = document.createElement('span'); jt.className = 'jtag'; jt.textContent = c.jp ? 'Jumper' : 'Extra'; info.append(jt);
            cap.append(info); cap.classList.add('on');
          }
        } else if (c.pos && !cross) holder.append(document.createTextNode(c.n));
      } else {
        const idx = flat.length; flat.push(c); c.o = g.o;
        const d = CARDS[c.i];
        const b = document.createElement('button'); b.type = 'button'; b.className = 'card' + (c.rev ? ' rv' : '') + (animate ? ' pending' : '');
        b.setAttribute('aria-label', d.n + ', ' + oriWord(c) + (c.jp ? ', jumper' : '') + (c.x ? ', extra card' : '') + '. Open');
        b.disabled = !!animate;
        const fl = document.createElement('div'); fl.className = 'cflip' + (animate ? ' down' : '');
        const fr = document.createElement('div'); fr.className = 'cface cfront';
        const im = document.createElement('img'); im.src = src(d.k); im.alt = d.n; fr.append(im);
        const bk = document.createElement('div'); bk.className = 'cface cback';
        fl.append(fr, bk); b.append(fl);
        b.addEventListener('click', () => openCard(idx));
        holder.append(b); thumbs.push(b);
        if (enter) {
          const eb = document.createElement('button'); eb.type = 'button'; eb.className = 'edit'; eb.textContent = '✎';
          eb.setAttribute('aria-label', 'Change this card');
          eb.addEventListener('click', ev => { ev.stopPropagation(); openPicker(g, c); });
          holder.append(eb);
        }
        if (!animate) holder.classList.add('filled');
        if (c.jp || c.x) {
          const info = document.createElement('div'); info.className = 'info';
          const jt = document.createElement('span'); jt.className = 'jtag'; jt.textContent = c.jp ? 'Jumper' : 'Extra'; info.append(jt);
          cap.append(info);
        }
        if (!animate) cap.classList.add('on');
      }
      slot.append(holder, cap); grid.append(slot);
    });
    sec.append(grid);
    if (cross) {
      const lg = document.createElement('ol'); lg.className = 'legend';
      SPREADS.celtic.pos.forEach((p, k) => {
        const li = document.createElement('li'); const b = document.createElement('b'); b.textContent = k + 1;
        li.append(b, document.createTextNode(p[1])); lg.append(li);
      });
      sec.append(lg);
    }
    out.append(sec);
  });
}

function setMoreHidden(h) { document.querySelectorAll('.grp .more').forEach(b => { b.hidden = h; }); }

/* ---------- dealing ---------- */
function resetTable() {
  dealId++; dealing = false;
  $('draw').disabled = false; $('pile').classList.remove('on');
  draw = null; curId = null; curNote = ''; saved = false;
  if (S.mode === 'enter') { draw = layout(); curId = newId(); curTs = Date.now(); render(draw, 'none'); } else render(layout(), 'none');
}

async function preload(list) {
  await Promise.all(list.map(c => {
    const im = new Image(); im.src = src(CARDS[c.i].k);
    return (im.decode ? im.decode() : Promise.resolve()).catch(() => {});
  }));
}

async function bring(el) {
  const r = el.getBoundingClientRect();
  if (r.top < 12 || r.bottom > innerHeight - 110) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); await sleep(450); }
}

function deal1(i) {
  const b = thumbs[i], inner = b.firstChild, holder = b.parentNode, cap = holder.nextSibling;
  const rot = +(holder.dataset.rot || 0);
  const pr = $('pile').getBoundingClientRect(), t = holder.getBoundingClientRect();
  let dx = (pr.left + pr.width / 2) - (t.left + t.width / 2), dy = (pr.top + pr.height / 2) - (t.top + t.height / 2);
  const s = pr.width / holder.offsetWidth;
  if (rot === 90) { const x = dy, y = -dx; dx = x; dy = y; } /* the holder is turned a quarter, so carry the vector into its frame */
  b.style.zIndex = 5;
  b.classList.remove('pending');
  b.animate([
    { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ') rotate(' + (-9 - rot) + 'deg)' },
    { transform: 'translate(0,0) scale(1) rotate(0deg)' }
  ], { duration: 580, easing: 'cubic-bezier(.2, .8, .25, 1)' });
  setTimeout(() => { inner.classList.remove('down'); holder.classList.add('filled'); }, 340);
  setTimeout(() => { cap.classList.add('on'); b.disabled = false; b.style.zIndex = ''; }, 1000);
}

function lock(on) { dealing = on; $('draw').disabled = on; setMoreHidden(on); }

async function startDraw() {
  if (dealing) return;
  labels = labels.slice(0, S.opts);
  draw = makeDraw();
  curId = newId(); curTs = Date.now(); curNote = ''; saved = false;
  window.scrollTo(0, 0);
  const my = ++dealId; lock(true);
  render(draw, REDUCE ? 'none' : 'all');
  if (REDUCE) { lock(false); setMoreHidden(false); persistCurrent(); return; }
  await Promise.race([preload(flat), sleep(3000)]);
  if (my !== dealId) return;
  $('pile').classList.add('on'); await sleep(250);
  for (let i = 0; i < flat.length; i++) {
    if (my !== dealId) return;
    await bring(thumbs[i].parentNode);
    if (my !== dealId) return;
    deal1(i);
    await sleep(STAGGER);
  }
  await sleep(750);
  if (my !== dealId) return;
  $('pile').classList.remove('on'); lock(false);
  persistCurrent();
}

/* one more card, taken from what is left of the deck, added to the group where its button was tapped */
async function addExtra(g) {
  if (dealing || !draw) return;
  const used = new Set(); draw.forEach(x => x.cards.forEach(c => used.add(c.i)));
  const pool = []; CARDS.forEach((_, i) => { if (!used.has(i)) pool.push(i); });
  if (!pool.length) { toast('The deck is empty'); return; }
  const c = { i: pool[randInt(pool.length)], rev: S.rev && randInt(2) === 0, jp: false, x: true, pos: null, n: 0, fresh: true };
  g.cards.push(c);
  const my = ++dealId; lock(true);
  render(draw, REDUCE ? 'none' : 'new');
  const idx = flat.indexOf(c);
  if (!REDUCE) {
    await Promise.race([preload([c]), sleep(3000)]);
    if (my !== dealId) return;
    $('pile').classList.add('on'); await sleep(250);
    await bring(thumbs[idx].parentNode);
    if (my !== dealId) return;
    deal1(idx);
    await sleep(1300);
    if (my !== dealId) return;
    $('pile').classList.remove('on');
  }
  c.fresh = false; lock(false);
  persistCurrent();
}

/* ---------- history: kept in a Google Sheet through an Apps Script web app; this device keeps a cache and retries failed writes ---------- */
const newId = () => Date.now().toString(36) + randInt(46656).toString(36);
const CFG_KEY = 'tarotCfg', LOCAL_KEY = 'pocketTarotHistory', OUT_KEY = 'tarotOutbox', PAGE = 20;
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v === null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
/* a setup link carries the web app address and passcode in its #fragment, so it is never sent to any server */
(function () {
  try {
    const h = new URLSearchParams(location.hash.slice(1)), u = h.get('u'), t = h.get('t');
    if (u && t) { lsSet(CFG_KEY, { u, t }); window.history.replaceState(null, '', location.pathname + location.search); }
  } catch (e) {}
})();
const store = {
  cfg: lsGet(CFG_KEY, null), items: [], total: 0, shown: PAGE, ready: false, err: '', flushing: false,
  get mode() { return this.cfg ? 'sheet' : 'local'; },
  saveLocal() { lsSet(LOCAL_KEY, this.items.slice(0, 200)); },
  async api(q, body) {
    const u = new URL(this.cfg.u); let res;
    if (body) res = await fetch(u.toString(), { method: 'POST', body: JSON.stringify(Object.assign({ token: this.cfg.t }, body)), redirect: 'follow' });
    else { u.searchParams.set('token', this.cfg.t); Object.keys(q).forEach(k => u.searchParams.set(k, q[k])); res = await fetch(u.toString(), { redirect: 'follow' }); }
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'error');
    return j;
  },
  async flush() {
    if (this.flushing || !this.cfg) return;
    this.flushing = true;
    try {
      let ob = lsGet(OUT_KEY, []);
      while (ob.length) { await this.api(null, ob[0]); ob.shift(); lsSet(OUT_KEY, ob); }
    } finally { this.flushing = false; }
  },
  enqueue(op) {
    if (!this.cfg) return;
    const ob = lsGet(OUT_KEY, []); ob.push(op); lsSet(OUT_KEY, ob);
    this.flush().then(() => { this.err = ''; renderHist(); }, () => { this.err = 'Could not reach the Sheet yet. Saved on this device and will retry.'; renderHist(); });
  },
  async init() {
    this.items = lsGet(LOCAL_KEY, []); this.total = this.items.length; this.ready = true; renderHist();
    if (this.cfg) await this.sync();
  },
  async sync() {
    try {
      await this.flush();
      const j = await this.api({ action: 'list', offset: 0, limit: 40 });
      this.items = j.items; this.total = j.total; this.err = ''; this.saveLocal();
    } catch (e) { this.err = 'Could not reach the Sheet. Showing what is saved on this device.'; }
    this.ready = true; renderHist();
  },
  async more(all) {
    this.shown = all ? Math.max(this.total, this.shown) : this.shown + PAGE;
    const target = Math.min(this.shown, this.total);
    if (this.cfg && this.items.length < target) {
      try {
        const j = await this.api({ action: 'list', offset: this.items.length, limit: target - this.items.length });
        const have = new Set(this.items.map(x => x.id));
        this.items = this.items.concat(j.items.filter(x => !have.has(x.id))); this.total = j.total; this.err = '';
      } catch (e) { this.err = 'Could not load more from the Sheet.'; }
    }
    renderHist();
  },
  async connect(u, t) {
    const old = this.cfg; this.cfg = { u, t };
    try { await this.api({ action: 'list', offset: 0, limit: 1 }); }
    catch (e) { this.cfg = old; throw e; }
    lsSet(CFG_KEY, this.cfg);
    /* history already on this device goes up to the Sheet (a repeat just overwrites the same row) */
    this.items.forEach(x => this.enqueue({ action: 'put', entry: Object.assign({}, x, { text: entryText(x) }) }));
    await this.sync();
  },
  disconnect() { this.cfg = null; try { localStorage.removeItem(CFG_KEY); } catch (e) {} this.err = ''; renderHist(); },
  async put(id, obj) {
    const e = Object.assign({ id }, obj), existed = this.items.some(x => x.id === id);
    this.items = [e].concat(this.items.filter(x => x.id !== id)).sort((a, b) => b.ts - a.ts);
    if (!existed) this.total += 1;
    this.saveLocal(); renderHist();
    this.enqueue({ action: 'put', entry: Object.assign({}, e, { text: entryText(e) }) });
  },
  async patch(id, p) {
    let merged = null;
    this.items = this.items.map(x => { if (x.id !== id) return x; merged = Object.assign({}, x, p); return merged; });
    this.saveLocal(); renderHist();
    if (merged) this.enqueue({ action: 'patch', id, p: Object.assign({}, p, { text: entryText(merged) }) });
  },
  async del(id) {
    this.items = this.items.filter(x => x.id !== id); this.total = Math.max(0, this.total - 1);
    this.saveLocal(); renderHist();
    this.enqueue({ action: 'del', id });
  },
};

function entryFrom() {
  return {
    ts: curTs, spread: S.spread, q: $('q').value.trim(), note: curNote, manual: S.mode === 'enter',
    groups: draw.map(g => ({
      name: g.o !== undefined ? (labels[g.o] || '').trim() : '',
      cards: g.cards.filter(c => !c.empty).map(c => ({ k: CARDS[c.i].k, rev: !!c.rev, jp: !!c.jp, x: !!c.x, n: c.n || 0 })),
    })),
  };
}
async function persistCurrent() {
  if (!draw || !curId) return;
  const e = entryFrom();
  if (!saved) { saved = true; await store.put(curId, e); }
  else await store.patch(curId, { q: e.q, groups: e.groups });
}

function fmtTime(ts) {
  try { return new Date(ts).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
}
function entryGroups(e) {
  const sp = SPREADS[e.spread] ? e.spread : 'compare';
  return (e.groups || []).map((g, gi) => {
    const cards = (g.cards || []).filter(c => BY_K[c.k] !== undefined).map(c => ({
      i: BY_K[c.k], rev: !!c.rev, jp: !!c.jp, x: !!c.x, n: c.n || 0,
      pos: sp !== 'compare' && c.n > 0 && SPREADS[sp].pos[c.n - 1] ? SPREADS[sp].pos[c.n - 1] : null,
    }));
    return sp === 'compare' ? { o: gi, name: g.name || '', cards } : { sp, name: '', cards };
  });
}
function entryText(e) {
  const gs = entryGroups(e), sp = SPREADS[e.spread] ? e.spread : 'compare';
  const lines = [];
  if (e.q) lines.push('Q: ' + e.q);
  gs.forEach((g, gi) => {
    const d = c => CARDS[c.i].n + ' (' + oriWord(c) + ')';
    if (sp === 'compare') {
      const nm = (g.name && g.name.trim()) || 'Option ' + String.fromCharCode(65 + gi);
      const main = g.cards.filter(c => !c.jp && !c.x).map(d).join(', ');
      const jp = g.cards.filter(c => c.jp).map(d).join(', '), xt = g.cards.filter(c => c.x).map(d).join(', ');
      lines.push(nm + ': ' + main + (jp ? ' | Jumper: ' + jp : '') + (xt ? ' | Extra: ' + xt : ''));
    } else {
      lines.push(SPREADS[sp].name);
      g.cards.forEach(c => lines.push(c.pos ? c.n + '. ' + c.pos[0] + ': ' + d(c) : (c.jp ? 'Jumper: ' : 'Extra: ') + d(c)));
    }
  });
  return lines.join('\n');
}

function renderHist() {
  const sheet = $('hist');
  const on = store.mode === 'sheet';
  $('hmode').textContent = (on ? 'Saved to your Google Sheet, so every device sees the same list.' : 'Saved on this device only. Open “Google Sheet connection” below to sync across devices.') + (store.err ? ' ' + store.err : '');
  if (sheet.hidden) return;
  $('cd').hidden = !on;
  const list = $('hlist'); list.textContent = '';
  if (!store.items.length) {
    const n = document.createElement('div'); n.className = 'none'; n.textContent = store.ready ? 'No draws saved yet. Each finished draw is added here automatically.' : 'Loading…';
    list.append(n); return;
  }
  const wrap = document.createElement('div'); wrap.style.display = 'grid'; wrap.style.gap = '12px';
  const total = Math.max(store.total, store.items.length);
  store.items.slice(0, store.shown).forEach(e => {
    const art = document.createElement('article'); art.className = 'hi';
    const hh = document.createElement('div'); hh.className = 'hh';
    const sp = SPREADS[e.spread] ? e.spread : 'compare';
    const b = document.createElement('b'); b.textContent = sp === 'compare' ? 'Compare options' : spreadTitle(sp);
    const tm = document.createElement('time'); tm.textContent = (e.manual ? 'By hand · ' : '') + fmtTime(e.ts);
    hh.append(b, tm); art.append(hh);
    if (e.q) { const q = document.createElement('div'); q.className = 'hq'; q.textContent = e.q; art.append(q); }
    entryGroups(e).forEach((g, gi) => {
      const box = document.createElement('div'); box.className = 'hg';
      if (sp === 'compare') { const gl = document.createElement('div'); gl.className = 'gl'; gl.textContent = (g.name && g.name.trim()) || 'Option ' + String.fromCharCode(65 + gi); box.append(gl); }
      const row = document.createElement('div'); row.className = 'hc';
      g.cards.forEach(c => {
        const im = document.createElement('img'); im.src = src(CARDS[c.i].k); im.alt = CARDS[c.i].n + ' (' + oriWord(c) + ')'; im.loading = 'lazy';
        im.className = (c.rev ? 'rv ' : '') + (c.jp ? 'jp ' : '') + (c.x ? 'xt' : ''); row.append(im);
      });
      box.append(row); art.append(box);
    });
    const ta = document.createElement('textarea'); ta.className = 'hn'; ta.id = 'note-' + e.id; ta.value = e.note || '';
    ta.placeholder = 'What happened? Outcome or notes'; ta.setAttribute('aria-label', 'Outcome or notes for this draw');
    ta.addEventListener('change', () => { if (e.id === curId) curNote = ta.value; store.patch(e.id, { note: ta.value }); });
    art.append(ta);
    const ha = document.createElement('div'); ha.className = 'ha';
    const open = document.createElement('button'); open.type = 'button'; open.textContent = 'Open'; open.addEventListener('click', () => loadEntry(e));
    const cp = document.createElement('button'); cp.type = 'button'; cp.textContent = 'Copy'; cp.addEventListener('click', () => copyText(entryText(e) + (ta.value.trim() ? '\nOutcome: ' + ta.value.trim() : '')));
    const dl = document.createElement('button'); dl.type = 'button'; dl.className = 'del'; dl.textContent = 'Delete';
    let armed = 0;
    dl.addEventListener('click', () => {
      if (!armed) { armed = 1; dl.textContent = 'Tap again to delete'; setTimeout(() => { armed = 0; dl.textContent = 'Delete'; }, 3000); return; }
      store.del(e.id);
    });
    ha.append(open, cp, dl); art.append(ha);
    wrap.append(art);
  });
  list.append(wrap);
  const shownN = Math.min(store.shown, store.items.length);
  if (total > shownN || store.shown > store.items.length) {
    const m = document.createElement('div'); m.className = 'more2';
    m.append(mk('span', '', 'Showing ' + shownN + ' of ' + total));
    if (total > shownN) {
      const b1 = mk('button', '', 'Show ' + Math.min(PAGE, total - shownN) + ' more'); b1.type = 'button'; b1.addEventListener('click', () => store.more(false));
      const b2 = mk('button', '', 'Show all'); b2.type = 'button'; b2.addEventListener('click', () => store.more(true));
      m.append(b1, b2);
    }
    list.append(m);
  } else list.append(Object.assign(mk('p', 'mode', 'Showing all ' + total), { style: 'text-align:center' }));
}
$('cs').onclick = async () => {
  const u = $('cu').value.trim(), t = $('ct').value.trim(), msg = $('cmsg');
  if (!/^https:\/\/script\.google\.com\//.test(u) || !t) { msg.textContent = 'Paste the web app URL (starts with https://script.google.com/) and the passcode.'; return; }
  msg.textContent = 'Connecting…';
  try { await store.connect(u, t); msg.textContent = 'Connected.'; $('cu').value = ''; $('ct').value = ''; }
  catch (e) { msg.textContent = 'Could not connect: ' + (e.message === 'auth' ? 'wrong passcode.' : 'check the URL and that the web app is deployed for “Anyone”.'); }
  renderHist();
};
$('cd').onclick = () => { store.disconnect(); $('cmsg').textContent = 'Disconnected. History on this device stays, the Sheet is untouched.'; };
window.addEventListener('online', () => { if (store.cfg) store.sync(); });
function openHist() { $('hist').hidden = false; renderHist(); $('hist').scrollTop = 0; }
function closeHist() { $('hist').hidden = true; }
$('histBtn').onclick = openHist;
$('hx').onclick = closeHist;

function loadEntry(e) {
  const sp = SPREADS[e.spread] ? e.spread : 'compare';
  const groups = entryGroups(e);
  dealId++; lock(false); $('pile').classList.remove('on');
  S.spread = sp;
  labels = [];
  if (sp === 'compare') {
    S.opts = Math.min(MAX_OPT, Math.max(1, groups.length));
    S.per = Math.min(MAX_PER, Math.max(1, groups[0] ? groups[0].cards.filter(c => !c.jp && !c.x).length : 3));
    groups.forEach(g => { labels[g.o] = g.name || ''; });
  }
  $('q').value = e.q || '';
  S.mode = e.manual ? 'enter' : 'draw';
  if (e.manual) {
    const lay = layout();
    groups.forEach((g, gi) => {
      const lg = lay[gi]; if (!lg) return;
      g.cards.forEach(c => {
        let slot = null;
        if (!c.jp && !c.x) slot = sp !== 'compare' && c.n > 0 ? lg.cards[c.n - 1] : lg.cards.find(s => s.empty && !s.jp && !s.x);
        if (slot) { slot.i = c.i; slot.rev = c.rev; delete slot.empty; }
        else lg.cards.push({ i: c.i, rev: c.rev, jp: c.jp, x: c.x, pos: null, n: 0 });
      });
    });
    draw = lay;
  } else draw = groups;
  curId = e.id; curTs = e.ts; curNote = e.note || ''; saved = true;
  syncCtl(); save();
  render(draw, 'none');
  closeHist(); window.scrollTo(0, 0);
}

/* ---------- card viewer ---------- */
let cur = 0, lastFocus = null, closeTimer = 0;
const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
const bi = (en, vi) => { const f = document.createDocumentFragment(); [['EN', en], ['VI', vi]].forEach(([l, t]) => { const p = mk('p', 'm'); p.append(mk('span', 'lg', l), document.createTextNode(t)); f.append(p); }); return f; };
const para = (cls, head, text) => { const p = mk('p', cls); p.append(mk('b', '', head), document.createTextNode(text)); return p; };

function showCard() {
  const c = flat[cur], d = CARDS[c.i];
  thumbs.forEach((b, i) => b.classList.toggle('ghost', i === cur));
  $('flip').classList.remove('on');
  $('mfront').className = 'face front' + (c.rev ? ' rv' : '');
  const im = $('mimg'); im.src = src(d.k); im.alt = d.n;
  const back = $('mback'); back.textContent = ''; back.scrollTop = 0;
  if (c.pos) back.append(mk('div', 'where', c.n + ' · ' + c.pos[0] + ' / ' + c.pos[1]));
  else if (c.jp) back.append(mk('div', 'where', 'Jumper'));
  else if (c.x) back.append(mk('div', 'where', 'Extra card'));
  else if (c.o !== undefined) back.append(mk('div', 'where', optName(c.o)));
  back.append(mk('div', 'arc', d.arc + (d.sub ? ' · ' + d.sub : '')));
  back.append(mk('h3', '', d.n));
  back.append(mk('span', 'chip' + (c.rev ? ' r' : ''), c.rev ? 'Reversed' : 'Upright'));
  back.append(bi(c.rev ? d.rv : d.up, c.rev ? d.vr : d.vu));
  back.append(para('img', 'Hình ảnh trên lá bài', d.d));
  back.append(para('img lk', c.rev ? 'Vì sao hình này mang nghĩa ngược' : 'Vì sao hình này mang nghĩa đó', c.rev ? d.lr : d.lu));
  back.append(para('other', c.rev ? 'Upright' : 'Reversed', (c.rev ? d.up : d.rv) + ' — ' + (c.rev ? d.vu : d.vr) + '\n' + (c.rev ? d.lu : d.lr)));
  $('mpos').textContent = (cur + 1) + ' / ' + flat.length;
}

function placeFrom(thumb) {
  const z = $('zoom');
  z.style.transition = 'none'; z.style.transform = 'none';
  const f = z.getBoundingClientRect(), t = thumb.getBoundingClientRect();
  z.style.transform = 'translate(' + (t.left - f.left) + 'px,' + (t.top - f.top) + 'px) scale(' + (t.width / f.width) + ')';
  void z.offsetWidth;
}

function openCard(i) {
  clearTimeout(closeTimer);
  cur = i; lastFocus = document.activeElement;
  showCard();
  const m = $('modal'), z = $('zoom');
  m.hidden = false;
  if (REDUCE) { z.style.transition = 'none'; z.style.transform = 'none'; m.classList.add('show'); $('mx').focus(); return; }
  placeFrom(thumbs[i]);
  z.style.transition = 'transform .5s cubic-bezier(.2, .8, .2, 1)';
  z.style.transform = 'none';
  requestAnimationFrame(() => m.classList.add('show'));
  $('mx').focus({ preventScroll: true });
}

function closeCard() {
  const m = $('modal'), z = $('zoom');
  if (m.hidden) return;
  const finish = () => { m.hidden = true; thumbs.forEach(b => b.classList.remove('ghost')); z.style.transition = 'none'; z.style.transform = 'none'; $('flip').classList.remove('on'); if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true }); };
  $('flip').classList.remove('on');
  if (REDUCE) { m.classList.remove('show'); finish(); return; }
  const t = thumbs[cur]; t.scrollIntoView({ block: 'nearest' });
  const f = z.getBoundingClientRect(), r = t.getBoundingClientRect();
  z.style.transition = 'transform .45s cubic-bezier(.4, 0, .2, 1)';
  z.style.transform = 'translate(' + (r.left - f.left) + 'px,' + (r.top - f.top) + 'px) scale(' + (r.width / f.width) + ')';
  m.classList.remove('show');
  clearTimeout(closeTimer); closeTimer = setTimeout(finish, 470);
}

function step(d) {
  cur = (cur + d + flat.length) % flat.length;
  showCard();
  if (!REDUCE) $('zoom').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220 });
}
function flip() { $('flip').classList.toggle('on'); }
$('flip').addEventListener('click', flip);
$('flip').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
$('mx').addEventListener('click', closeCard);
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeCard(); });
$('prev').addEventListener('click', () => step(-1));
$('next').addEventListener('click', () => step(1));
document.addEventListener('keydown', e => {
  if (!$('modal').hidden) {
    if (e.key === 'Escape') closeCard();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  } else if (!$('pick').hidden && e.key === 'Escape') closePick();
  else if (!$('hist').hidden && e.key === 'Escape') closeHist();
});

/* ---------- controls ---------- */
function syncCtl() {
  $('spread').value = S.spread;
  $('cmpCtl').hidden = S.spread !== 'compare';
  $('optVal').textContent = S.opts; $('perVal').textContent = S.per;
  $('revBox').checked = S.rev; $('jumpBox').checked = S.jump;
  const en = S.mode === 'enter';
  $('mDraw').setAttribute('aria-pressed', String(!en)); $('mEnter').setAttribute('aria-pressed', String(en));
  $('rowRev').hidden = en; $('rowJump').hidden = en; $('clearRow').hidden = !en;
  $('draw').hidden = en; $('save').hidden = !en;
}
function changed() { syncCtl(); save(); resetTable(); }
$('spread').onchange = e => { S.spread = e.target.value; changed(); };
$('optMinus').onclick = () => { S.opts = Math.max(1, S.opts - 1); changed(); };
$('optPlus').onclick = () => { S.opts = Math.min(MAX_OPT, S.opts + 1); changed(); };
$('perMinus').onclick = () => { S.per = Math.max(1, S.per - 1); changed(); };
$('perPlus').onclick = () => { S.per = Math.min(MAX_PER, S.per + 1); changed(); };
$('revBox').onchange = e => { S.rev = e.target.checked; save(); };
$('jumpBox').onchange = e => { S.jump = e.target.checked; save(); };
$('q').addEventListener('change', () => { if (draw && curId && saved) persistCurrent(); });
$('draw').onclick = startDraw;

/* ---------- copy ---------- */
function toast(t) { const e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { e.hidden = true; }, 1800); }
function fallbackCopy(t) {
  const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.append(ta); ta.select(); let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); return ok;
}
function copyText(t) {
  const done = ok => toast(ok ? 'Copied' : 'Could not copy');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => done(true), () => done(fallbackCopy(t)));
  else done(fallbackCopy(t));
}
$('copy').onclick = () => {
  if (!draw || dealing) { toast(dealing ? 'Wait for the deal to finish' : 'Draw first'); return; }
  const e0 = entryFrom();
  if (!e0.groups.some(g => g.cards.length)) { toast(S.mode === 'enter' ? 'Add cards first' : 'Draw first'); return; }
  copyText(entryText(e0));
};

/* ---------- hand entry ---------- */
$('mDraw').onclick = () => { if (S.mode !== 'draw') { S.mode = 'draw'; changed(); } };
$('mEnter').onclick = () => { if (S.mode !== 'enter') { S.mode = 'enter'; changed(); } };
$('clear').onclick = () => { resetTable(); toast('Cleared'); };

let pT = null, pRev = false, pArc = 'All';
const ARCS = [['All', 'All'], ['Major Arcana', 'Major'], ['Cups', 'Cups'], ['Wands', 'Wands'], ['Swords', 'Swords'], ['Pentacles', 'Pentacles']];
function setOri(r) { pRev = r; $('pUp').setAttribute('aria-pressed', String(!r)); $('pRv').setAttribute('aria-pressed', String(r)); $('pg').classList.toggle('rv', r); }
function buildChips() {
  const box = $('pf'); box.textContent = '';
  ARCS.forEach(([k, lab]) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = lab; b.setAttribute('aria-pressed', String(pArc === k));
    b.addEventListener('click', () => { pArc = k; buildChips(); renderPick(); });
    box.append(b);
  });
}
function renderPick() {
  const used = new Set();
  draw.forEach(g => g.cards.forEach(c => { if (!c.empty && c !== pT.c) used.add(c.i); }));
  const q = $('ps').value.trim().toLowerCase();
  const grid = $('pg'); grid.textContent = '';
  CARDS.forEach((d, i) => {
    if (pArc !== 'All' && d.arc !== pArc) return;
    if (q && d.n.toLowerCase().indexOf(q) < 0) return;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pc' + (!pT.c.empty && pT.c.i === i ? ' cur' : '');
    b.disabled = used.has(i); b.setAttribute('aria-label', d.n + (used.has(i) ? ' (already on the table)' : ''));
    const im = document.createElement('img'); im.src = src(d.k); im.alt = '';
    b.append(im, mk('span', '', d.n));
    b.addEventListener('click', () => { pT.c.i = i; pT.c.rev = pRev; delete pT.c.empty; closePick(); render(draw, 'none'); });
    grid.append(b);
  });
  if (!grid.firstChild) grid.append(mk('p', 'mode', 'No card matches.'));
}
function openPicker(g, c) {
  pT = { g, c }; pArc = 'All'; $('ps').value = '';
  const k = g.cards.indexOf(c) + 1;
  $('pt').textContent = c.pos ? c.n + ' · ' + c.pos[0] + ' / ' + c.pos[1] : c.jp ? 'Jumper' : c.x ? 'Extra card' : (g.o !== undefined ? optName(g.o) + ' · card ' + k : 'Choose a card');
  $('prm').textContent = (c.jp || c.x) ? 'Remove this slot' : 'Clear this slot';
  $('prm').hidden = c.empty && !(c.jp || c.x);
  setOri(!!c.rev); buildChips(); renderPick();
  $('pick').hidden = false; $('pick').scrollTop = 0;
}
function closePick() { $('pick').hidden = true; pT = null; }
$('px').onclick = closePick;
$('pUp').onclick = () => setOri(false);
$('pRv').onclick = () => setOri(true);
$('ps').addEventListener('input', () => { if (pT) renderPick(); });
$('prm').onclick = () => {
  const { g, c } = pT;
  if (c.jp || c.x) g.cards.splice(g.cards.indexOf(c), 1);
  else { delete c.i; c.rev = false; c.empty = true; }
  closePick(); render(draw, 'none');
};
$('save').onclick = async () => {
  if (!draw || S.mode !== 'enter') return;
  const miss = draw.reduce((a, g) => a + g.cards.filter(c => c.empty && !c.jp && !c.x).length, 0);
  if (miss) { toast(miss + (miss > 1 ? ' slots' : ' slot') + ' still empty'); return; }
  const e = entryFrom();
  if (!e.groups.some(g => g.cards.length)) { toast('Add cards first'); return; }
  e.note = curNote; saved = true;
  await store.put(curId, e);
  toast('Saved to History');
};

syncCtl();
resetTable();
store.init();
</script>

</body>
</html>
