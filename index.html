<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarot Log</title>
<meta name="apple-mobile-web-app-title" content="Tarot Log">
<meta name="application-name" content="Tarot Log">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#241f47">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Cormorant+Garamond:wght@500;600;700&display=swap">
<style>
[hidden] { display: none !important; }
/* Layout: one narrow column built for a phone. Question and spread settings on top, a table of dashed empty slots below that cards get dealt into one by one from a deck pile above the Draw bar, a history sheet, and a card viewer that grows out of the tapped card and flips to its meaning. */
:root {
  --bg: #eceaf1;
  --surface: #f8f7fb;
  --line: #cfcbdb;
  --fg: #1d1a2e;
  --muted: #615b78;
  --accent: #8a5b00;
  --accent-fg: #fffaf0;
  --rev: #b3392a;
  --scrim: rgba(20, 17, 34, .88);
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14121c; --surface: #1e1b2b; --line: #373249; --fg: #ece6d8; --muted: #a29bb4;
    --accent: #dba843; --accent-fg: #1a1408; --rev: #ee7d69; --scrim: rgba(8, 6, 14, .92);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14121c; --surface: #1e1b2b; --line: #373249; --fg: #ece6d8; --muted: #a29bb4;
  --accent: #dba843; --accent-fg: #1a1408; --rev: #ee7d69; --scrim: rgba(8, 6, 14, .92);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5; padding-inline: 16px; padding-block: 18px 120px; }
.wrap { max-width: 640px; margin-inline: auto; display: grid; gap: 18px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 2.2rem; line-height: 1; margin: 0; letter-spacing: .01em; }
.sub { color: var(--muted); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; margin: 6px 0 0; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .flip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.ctl { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; }
.ctl input.q { width: 100%; height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding-inline: 12px; }
.ctl input.q::placeholder, .grp input.name::placeholder, .hn::placeholder { color: var(--muted); opacity: .8; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.row label, .row .lbl { font-weight: 500; }
select { height: 40px; min-width: 0; max-width: 64%; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding-inline: 10px; }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 1.3rem; line-height: 1; }
.step output { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
.switch { position: relative; width: 50px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 14px; background: var(--line); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); transition: transform .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(22px); background: var(--accent-fg); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

#out { display: grid; gap: 24px; }
.grp h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font-size: 1rem; min-height: 34px; }
.grp .tag { font-family: var(--display); font-weight: 700; font-size: 1.5rem; color: var(--accent); line-height: 1; }
.grp .title { font-family: var(--display); font-weight: 700; font-size: 1.45rem; line-height: 1.1; }
.grp input.name { flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1px dashed var(--line); color: var(--fg); font: inherit; font-weight: 500; padding: 4px 0; border-radius: 0; }
.grp .more { margin-left: auto; flex: none; height: 32px; padding-inline: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: .78rem; font-weight: 700; color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 10px; }
.cards.n4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cards.cross { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.slot { min-width: 0; display: grid; gap: 6px; align-content: start; }
.legend { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-size: .78rem; color: var(--muted); }
.legend b { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-right: 6px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-size: .68rem; }

/* the empty spot, which the dealt card lands on */
.holder { position: relative; width: 100%; aspect-ratio: 350 / 600; border: 1.5px dashed var(--line); border-radius: 8px; display: grid; place-items: center; color: var(--line); font-family: var(--display); font-weight: 700; font-size: 1.8rem; }
.holder.filled { border-color: transparent; }
.badge { position: absolute; top: 4px; left: 4px; z-index: 3; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font: 700 .68rem/18px var(--body); text-align: center; pointer-events: none; }
.card { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: none; display: block; perspective: 900px; border-radius: 8px; }
.card.pending { visibility: hidden; }
.card.ghost { visibility: hidden; }
.cflip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .75s cubic-bezier(.4, .1, .2, 1); }
.cflip.down { transform: rotateY(180deg); transition: none; }
.cface { position: absolute; inset: 0; border-radius: 7px; overflow: hidden; -webkit-backface-visibility: hidden; backface-visibility: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.28); }
.cfront { border: 1px solid var(--line); background: var(--surface); }
.cfront img { width: 100%; height: 100%; display: block; object-fit: cover; }
.card.rv .cfront img { transform: rotate(180deg); }
.slot.jp .cfront { border: 2px dashed var(--accent); }
.slot.xt .cfront { border: 2px solid var(--accent); }
/* card back, drawn in code: deep indigo with a brass lattice and ring */
.cback { background-color: #2a2450; background-image: radial-gradient(circle at 50% 50%, #2a2450 0 11%, #c9a24b 11.5% 13.5%, #2a2450 14% 19%, #c9a24b 19.5% 20.5%, transparent 21%), repeating-linear-gradient(45deg, rgba(201,162,75,.30) 0 1px, transparent 1px 10px), repeating-linear-gradient(-45deg, rgba(201,162,75,.30) 0 1px, transparent 1px 10px); box-shadow: inset 0 0 0 4px #2a2450, inset 0 0 0 5px #c9a24b, 0 2px 8px rgba(0,0,0,.3); }
.cflip .cback { transform: rotateY(180deg); }

.cap { font-size: .74rem; line-height: 1.3; color: var(--muted); overflow-wrap: anywhere; min-height: 1.3em; text-align: center; }
.cap .pos { display: block; color: var(--accent); font-weight: 700; }
.cap .info { opacity: 0; transition: opacity .5s ease; }
.cap.on .info { opacity: 1; }
.jtag { color: var(--accent); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .64rem; }

/* deck pile that cards are dealt from */
.pile { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); width: 50px; aspect-ratio: 350 / 600; transform: translateX(-50%); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 3; }
.pile.on { opacity: 1; }
.pile .cback { position: absolute; inset: 0; border-radius: 6px; }
.pile .cback:nth-child(1) { transform: translate(-3px, 3px); }
.pile .cback:nth-child(2) { transform: translate(-1.5px, 1.5px); }

.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: center; z-index: 2; }
.bar button { height: 50px; border-radius: 10px; font-weight: 700; font-size: .95rem; border: 1px solid var(--line); background: var(--surface); padding-inline: 16px; }
.bar button.go { flex: 1; max-width: 360px; background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-family: var(--display); font-size: 1.4rem; letter-spacing: .04em; }
.bar button:disabled { opacity: .55; cursor: default; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: .85rem; z-index: 30; max-width: 90vw; text-align: center; }

/* history sheet */
.sheet { position: fixed; inset: 0; z-index: 12; background: var(--bg); overflow: auto; padding-inline: 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.sheet .in { max-width: 640px; margin-inline: auto; display: grid; gap: 14px; }
.sheet header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet h2 { font-family: var(--display); font-size: 1.8rem; margin: 0; line-height: 1; }
.sheet .close { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 1.5rem; line-height: 1; }
.sheet .mode { color: var(--muted); font-size: .74rem; margin: 0; }
.sheet .none { color: var(--muted); border: 1.5px dashed var(--line); border-radius: 10px; padding: 24px 16px; text-align: center; }
.hi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; }
.hh { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.hh b { font-family: var(--display); font-size: 1.25rem; line-height: 1.1; }
.hh time { color: var(--muted); font-size: .74rem; flex: none; font-variant-numeric: tabular-nums; }
.hq { font-weight: 500; }
.hg { display: grid; gap: 4px; }
.hg .gl { color: var(--accent); font-size: .72rem; font-weight: 700; }
.hc { display: flex; flex-wrap: wrap; gap: 5px; }
.hc img { display: block; width: 34px; aspect-ratio: 350 / 600; object-fit: cover; border-radius: 3px; border: 1px solid var(--line); }
.hc img.rv { transform: rotate(180deg); }
.hc img.jp { border: 2px dashed var(--accent); }
.hc img.xt { border: 2px solid var(--accent); }
.hn { width: 100%; min-height: 60px; resize: vertical; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 8px 10px; }
.ha { display: flex; gap: 8px; flex-wrap: wrap; }
.ha button { height: 36px; padding-inline: 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: .82rem; font-weight: 700; }
.ha button.del { margin-left: auto; color: var(--rev); }

.modal { position: fixed; inset: 0; z-index: 10; background: var(--scrim); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); color: #ece6d8; opacity: 0; transition: opacity .3s ease; }
.modal.show { opacity: 1; }
.modal .x { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); font-size: 1.6rem; line-height: 1; color: #ece6d8; z-index: 2; }
/* .zoom moves and scales from the tapped thumbnail to full size; .flip inside it turns around */
.zoom { width: min(82vw, calc((100dvh - 190px) * 350 / 600)); aspect-ratio: 350 / 600; transform-origin: 0 0; perspective: 1400px; will-change: transform; }
.flip { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.4, .1, .2, 1); cursor: pointer; border-radius: 10px; }
.flip.on { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 10px; overflow: hidden; -webkit-backface-visibility: hidden; backface-visibility: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.face.front img { width: 100%; height: 100%; display: block; object-fit: cover; }
.face.front.rv img { transform: rotate(180deg); }
.face.back { transform: rotateY(180deg); background: var(--surface); color: var(--fg); border: 1px solid var(--line); padding: 16px 15px; overflow: auto; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
.back .where { color: var(--accent); font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.back .arc { color: var(--muted); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; }
.back h3 { font-family: var(--display); font-weight: 700; font-size: 1.65rem; line-height: 1.05; margin: 0; }
.back .chip { align-self: flex-start; font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--accent); color: var(--accent); }
.back .chip.r { border-color: var(--rev); color: var(--rev); }
.back .m { margin: 0; font-size: .92rem; line-height: 1.4; }
.back .lg { display: inline-block; min-width: 24px; margin-right: 6px; font-size: .62rem; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.back .img { margin: 2px 0 0; padding-top: 8px; border-top: 1px solid var(--line); font-size: .84rem; line-height: 1.5; }
.back .img b, .back .other b { display: block; font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.back .lk { border-top: 0; padding-top: 0; }
.back .lk b { color: var(--accent); }
.back .other { white-space: pre-line; color: var(--muted); font-size: .76rem; line-height: 1.4; margin: 2px 0 0; padding-top: 8px; border-top: 1px solid var(--line); }
.nav { display: flex; align-items: center; gap: 16px; }
.nav button { width: 52px; height: 44px; border-radius: 10px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); font-size: 1.5rem; line-height: 1; color: #ece6d8; }
.nav span { min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; font-size: .9rem; }
.tip { margin: 0; font-size: .74rem; opacity: .7; }
@media (prefers-reduced-motion: reduce) { .flip, .cflip, .modal, .pile, .cap .info, .switch span, .switch span::after { transition: none; } }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 3px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.seg button { height: 38px; border-radius: 8px; border: 0; background: transparent; font-weight: 700; font-size: .85rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.grp h2 { flex-wrap: wrap; }
.grp input.name { min-width: 90px; }
.grp .more + .more { margin-left: 0; }
.holder.tap { cursor: pointer; border-color: var(--accent); color: var(--accent); }
.slot.jp .holder.tap, .slot.xt .holder.tap { border-style: dashed; }
.holder.tap:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.edit { position: absolute; top: 4px; right: 4px; z-index: 4; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(20,17,34,.72); color: #fff; font-size: .9rem; line-height: 1; display: grid; place-items: center; padding: 0; }
.mini { height: 36px; padding-inline: 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-weight: 700; font-size: .82rem; }
#pick { z-index: 14; }
.q2 { width: 100%; height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding-inline: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { height: 34px; padding-inline: 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: .8rem; font-weight: 700; }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.pgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 8px; }
.pgrid .pc { padding: 0; border: 0; background: none; text-align: center; display: grid; gap: 4px; align-content: start; }
.pgrid .pc img { width: 100%; aspect-ratio: 350 / 600; object-fit: cover; border-radius: 5px; border: 1px solid var(--line); display: block; }
.pgrid.rv .pc img { transform: rotate(180deg); }
.pgrid .pc span { font-size: .64rem; line-height: 1.2; color: var(--muted); overflow-wrap: anywhere; }
.pgrid .pc:disabled { opacity: .28; cursor: default; }
.pgrid .pc.cur img { outline: 2px solid var(--accent); outline-offset: 1px; }
.rm { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--rev); font-weight: 700; }
.conn { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.conn summary { cursor: pointer; font-weight: 700; min-height: 28px; }
.cbody { display: grid; gap: 10px; margin-top: 10px; }
.more2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; }
.more2 button { height: 40px; padding-inline: 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
.more2 span { color: var(--muted); font-size: .78rem; width: 100%; text-align: center; }
</style>

</head>
<body>
<main class="wrap">
  <header>
    <h1>Tarot Log</h1>
    <p class="sub">Rider-Waite-Smith · random draw</p>
  </header>

  <section class="ctl" aria-label="Draw settings">
    <div class="seg" role="group" aria-label="Mode"><button type="button" id="mDraw" aria-pressed="true">Draw for me</button><button type="button" id="mEnter" aria-pressed="false">I drew by hand</button></div>
    <input class="q" id="q" type="text" maxlength="200" placeholder="Question or decision (optional)" aria-label="Question or decision" autocomplete="off">
    <div class="row"><label for="spread">Spread</label>
      <select id="spread">
        <option value="compare">Compare options</option>
        <option value="one">Single card</option>
        <option value="ppf">Past · Present · Future</option>
        <option value="sca">Situation · Challenge · Advice</option>
        <option value="horseshoe">Horseshoe (7)</option>
        <option value="celtic">Celtic Cross (10)</option>
      </select></div>
    <div id="cmpCtl" style="display: contents">
      <div class="row"><span class="lbl">Options to compare</span>
        <div class="step"><button type="button" id="optMinus" aria-label="Fewer options">−</button><output id="optVal">3</output><button type="button" id="optPlus" aria-label="More options">+</button></div></div>
      <div class="row"><span class="lbl">Cards per option</span>
        <div class="step"><button type="button" id="perMinus" aria-label="Fewer cards">−</button><output id="perVal">3</output><button type="button" id="perPlus" aria-label="More cards">+</button></div></div>
    </div>
    <div class="row" id="rowRev"><label for="revBox">Reversed cards</label>
      <span class="switch"><input type="checkbox" id="revBox" checked><span></span></span></div>
    <div class="row" id="rowJump"><label for="jumpBox">Jumpers</label>
      <span class="switch"><input type="checkbox" id="jumpBox" checked><span></span></span></div>
    <div class="row" id="clearRow" hidden><span class="lbl">Table</span><button type="button" class="mini" id="clear">Clear all cards</button></div>
  </section>

  <section id="out" aria-live="polite"></section>
</main>

<div class="pile" id="pile" aria-hidden="true"><span class="cback"></span><span class="cback"></span><span class="cback"></span></div>
<div class="bar">
  <button type="button" id="histBtn">History</button>
  <button type="button" id="copy">Copy</button>
  <button type="button" class="go" id="draw">Draw</button>
  <button type="button" class="go" id="save" hidden>Save</button>
</div>
<div class="toast" id="toast" hidden></div>

<div class="sheet" id="hist" hidden role="dialog" aria-modal="true" aria-label="History">
  <div class="in">
    <header><h2>History</h2><button type="button" class="close" id="hx" aria-label="Close history">×</button></header>
    <p class="mode" id="hmode"></p>
    <details class="conn" id="conn"><summary>Google Sheet connection</summary>
      <div class="cbody">
        <input class="q2" id="cu" type="url" placeholder="Web app URL (https://script.google.com/...)" aria-label="Web app URL" autocomplete="off">
        <input class="q2" id="ct" type="password" placeholder="Passcode" aria-label="Passcode" autocomplete="off">
        <div class="ha"><button type="button" id="cs">Connect</button><button type="button" id="cd">Disconnect</button></div>
        <p class="mode" id="cmsg"></p>
      </div></details>
    <div id="hlist"></div>
  </div>
</div>

<div class="sheet" id="pick" hidden role="dialog" aria-modal="true" aria-label="Choose a card">
  <div class="in">
    <header><h2 id="pt">Choose a card</h2><button type="button" class="close" id="px" aria-label="Close">×</button></header>

<script>
const CARDS = [{"k":"m00","n":"The Fool","arc":"Major Arcana","sub":"0","up":"New beginnings, leap of faith, innocence","rv":"Recklessness, naivety, hesitation","vu":"Khởi đầu mới, dám bước đi, ngây thơ","vr":"Liều lĩnh, ngây ngô, do dự","d":"Chàng trai trẻ đứng sát mép vực, vai vác gậy buộc túi nhỏ, tay cầm bông hồng trắng, mắt nhìn lên trời. Chú chó nhảy theo dưới chân, mặt trời lớn phía sau.","lu":"Anh ta bước về phía mép vực mà mắt chỉ nhìn trời: đó là sự dám bước đi, không tính trước. Chiếc túi nhỏ nghĩa là chưa mang gì nhiều, bắt đầu từ con số không, nên là khởi đầu mới. Bông hồng trắng và vẻ mặt vui vẻ nói lên sự ngây thơ, còn mặt trời rực rỡ báo hiệu hành trình này được chúc phúc.","lr":"Khi lá bị ngược, bước chân hướng về mép vực trở thành liều lĩnh: nhảy mà không nhìn đường. Sự ngây thơ biến thành ngây ngô, hoặc người ấy đứng khựng ở mép vực vì do dự, không dám bước."},{"k":"m01","n":"The Magician","arc":"Major Arcana","sub":"I","up":"Willpower, skill, resourcefulness, action","rv":"Manipulation, untapped talent, poor planning","vu":"Ý chí, kỹ năng, biết tận dụng nguồn lực, hành động","vr":"Thao túng, tài năng chưa dùng, lên kế hoạch kém","d":"Một tay giơ đũa phép lên trời, tay kia chỉ xuống đất. Trên bàn có đủ bốn vật của bốn bộ (gậy, cốc, kiếm, đồng xu). Trên đầu là dấu vô cực, quanh người là hoa hồng và hoa huệ.","lu":"Một tay giơ lên trời, một tay chỉ xuống đất: ông là cầu nối biến ý chí thành hiện thực, nên mang nghĩa ý chí và hành động. Bốn vật trên bàn (gậy, cốc, kiếm, đồng xu) là toàn bộ nguồn lực đã bày sẵn trước mặt, tức là biết tận dụng nguồn lực. Dấu vô cực trên đầu cùng hoa hồng, hoa huệ quanh người cho thấy kỹ năng đã được rèn, không phải may rủi.","lr":"Ngược lại, bốn vật trên bàn có thể bị dùng sai: thao túng người khác hoặc phô diễn mánh khóe. Cũng có thể bàn đầy đồ mà không ai dùng, tức là tài năng chưa dùng hoặc kế hoạch lộn xộn."},{"k":"m02","n":"The High Priestess","arc":"Major Arcana","sub":"II","up":"Intuition, hidden knowledge, stillness","rv":"Secrets, ignoring intuition, withdrawal","vu":"Trực giác, tri thức ẩn, tĩnh lặng","vr":"Bí mật, phớt lờ trực giác, thu mình","d":"Người phụ nữ ngồi giữa hai cột đen và trắng, đội mão trăng, tay cầm cuộn giấy. Sau lưng là tấm màn thêu quả lựu, dưới chân là trăng lưỡi liềm.","lu":"Hai cột đen và trắng là cánh cổng giữa hai thế giới, bà ngồi giữa và không nói gì: đó là sự tĩnh lặng. Tấm màn thêu quả lựu che phía sau cho thấy phần hiểu biết bà có nhưng không phô ra, tức tri thức ẩn. Cuộn giấy che một nửa và trăng dưới chân nhắc rằng đáp án đến từ trực giác, không phải từ lý luận.","lr":"Bị ngược, bà như quay mặt khỏi tấm màn: phớt lờ trực giác. Điều bà biết vẫn bị giấu kín thành bí mật, hoặc người ấy thu mình, không chịu mở lòng."},{"k":"m03","n":"The Empress","arc":"Major Arcana","sub":"III","up":"Nurturing, abundance, creativity","rv":"Smothering, creative block, dependence","vu":"Nuôi dưỡng, dồi dào, sáng tạo","vr":"Bao bọc quá mức, bế tắc sáng tạo, phụ thuộc","d":"Người phụ nữ ngồi thoải mái trên ghế đệm giữa cánh đồng lúa mì, đội vòng sao, áo thêu quả lựu. Có rừng cây và dòng suối bên cạnh, tấm khiên hình Venus.","lu":"Bà ngồi thoải mái giữa đồng lúa mì chín và rừng cây, thiên nhiên đầy ắp xung quanh: đó là sự dồi dào, phì nhiêu. Áo thêu quả lựu, vòng sao trên đầu và vẻ êm dịu là hình ảnh người mẹ, nên mang nghĩa nuôi dưỡng. Khoảnh khắc nghỉ ngơi giữa vườn là nơi mọi thứ được sinh ra, tức sáng tạo.","lr":"Sự nuôi dưỡng nếu quá đà thành bao bọc, ôm chặt đến ngột ngạt. Khi mất dòng chảy với thiên nhiên và bản thân thì sáng tạo bị chặn, hoặc người ta thấy mình phải dựa vào người khác."},{"k":"m04","n":"The Emperor","arc":"Major Arcana","sub":"IV","up":"Structure, authority, stability","rv":"Rigidity, control, domination","vu":"Cấu trúc, quyền uy, ổn định","vr":"Cứng nhắc, kiểm soát, áp đặt","d":"Vị vua râu trắng ngồi trên ngai đá khắc đầu cừu, tay cầm quyền trượng ankh và quả cầu, áo giáp dưới áo choàng đỏ. Núi đá khô cằn phía sau.","lu":"Ngai đá khắc đầu cừu, núi đá cứng phía sau: nền móng vững chắc, nên là cấu trúc và ổn định. Áo giáp dưới áo choàng và quyền trượng ankh trong tay cho thấy người nắm quyền có trách nhiệm bảo vệ, tức quyền uy. Ông ngồi thẳng, không dao động.","lr":"Ngược lại, sự vững chắc thành cứng nhắc, quyền uy thành kiểm soát và áp đặt. Ngai đá không lay chuyển cũng có thể là người không chịu nghe ai."},{"k":"m05","n":"The Hierophant","arc":"Major Arcana","sub":"V","up":"Tradition, institutions, guidance","rv":"Rebellion, unconventional path, dogma","vu":"Truyền thống, thể chế, sự dẫn dắt","vr":"Nổi loạn, lối đi khác thường, giáo điều","d":"Vị giáo hoàng ngồi giữa hai cột, một tay giơ ban phước, tay kia cầm trượng ba tầng. Hai tu sĩ quỳ trước mặt, dưới chân là hai chìa khóa bắt chéo.","lu":"Ông ngồi giữa hai cột trong điện thờ, ban phước cho hai tu sĩ đang quỳ: đó là truyền thống và thể chế. Hai chìa khóa dưới chân là chìa khóa tri thức được truyền lại, nên mang nghĩa sự dẫn dắt của người thầy hoặc quy tắc đã có.","lr":"Bị ngược, người ta không còn muốn quỳ nghe: nổi loạn, tìm lối đi riêng. Mặt tối là khi quy tắc cứng đến mức thành giáo điều."},{"k":"m06","n":"The Lovers","arc":"Major Arcana","sub":"VI","up":"Union, choice aligned with values, harmony","rv":"Disharmony, misaligned values, indecision","vu":"Kết hợp, lựa chọn hợp giá trị, hòa hợp","vr":"Bất hòa, lệch giá trị, do dự","d":"Một người nam và một người nữ trần đứng dưới thiên thần có cánh trên mặt trời. Sau lưng người nữ là cây táo có con rắn, sau lưng người nam là cây có những ngọn lửa.","lu":"Hai người trần đứng đối diện, thiên thần ở trên chiếu ánh sáng xuống: kết hợp trong sự thật, không che giấu. Cây táo có rắn sau lưng người nữ và cây lửa sau lưng người nam cho thấy mỗi người có cám dỗ riêng, nên đây là lựa chọn phải chọn theo giá trị của mình. Cả khung cảnh yên ả nên mang nghĩa hòa hợp.","lr":"Ngược lại, hai người không còn nhìn về cùng một phía: bất hòa hoặc giá trị lệch nhau. Không dám chọn giữa hai con đường nên do dự."},{"k":"m07","n":"The Chariot","arc":"Major Arcana","sub":"VII","up":"Determination, control, victory","rv":"Lack of direction, aggression, loss of control","vu":"Quyết tâm, kiểm soát, chiến thắng","vr":"Mất phương hướng, hung hăng, mất kiểm soát","d":"Người chiến binh mặc giáp đứng trong cỗ xe có mái che sao, hai nhân sư đen và trắng nằm phía trước, không có dây cương. Sau lưng là thành phố và con sông.","lu":"Người chiến binh đứng thẳng trong xe, không cầm dây cương mà điều khiển hai nhân sư (đen và trắng) bằng ý chí: đó là kiểm soát và quyết tâm. Vương miện sao và thành phố phía sau cho thấy anh sắp đạt đích, nên là chiến thắng.","lr":"Hai nhân sư không đồng lòng thì xe đi mỗi hướng: mất phương hướng, mất kiểm soát. Sự quyết tâm cũng có thể thành hung hăng, lao tới bằng mọi giá."},{"k":"m08","n":"Strength","arc":"Major Arcana","sub":"VIII","up":"Courage, patience, inner strength","rv":"Self-doubt, raw emotion, weakness","vu":"Can đảm, kiên nhẫn, sức mạnh nội tâm","vr":"Tự nghi ngờ, cảm xúc thô, yếu đuối","d":"Người phụ nữ áo trắng nhẹ nhàng khép miệng con sư tử, không dùng sức. Trên đầu có dấu vô cực và vòng hoa.","lu":"Người phụ nữ khép miệng sư tử bằng bàn tay nhẹ nhàng, không giằng co: sức mạnh nằm ở sự kiên nhẫn và can đảm bên trong. Dấu vô cực trên đầu nhắc rằng đó là nguồn lực lâu dài, còn con sư tử tượng trưng cho bản năng được thuần hóa chứ không bị đè nén.","lr":"Khi ngược, người phụ nữ mất kiểm soát con sư tử: bản năng và cảm xúc thô trào lên. Đó cũng là lúc tự nghi ngờ làm sức mạnh nội tâm yếu đi."},{"k":"m09","n":"The Hermit","arc":"Major Arcana","sub":"IX","up":"Soul-searching, solitude, inner guidance","rv":"Isolation, withdrawal, loneliness","vu":"Tự vấn, cô độc, định hướng từ bên trong","vr":"Cô lập, rút lui, cô đơn","d":"Cụ già mặc áo choàng xám đứng trên đỉnh núi tuyết, một tay chống gậy, tay kia cầm chiếc đèn lồng có ngôi sao sáu cánh.","lu":"Ông đứng một mình trên đỉnh núi tuyết: cô độc có chủ đích, để tự vấn. Ngọn đèn có ngôi sao sáu cánh chỉ đủ soi vài bước chân, nghĩa là ánh sáng đến từ bên trong và bạn chỉ cần thấy đủ cho bước kế tiếp. Chiếc gậy là điểm tựa của người đã đi nhiều.","lr":"Bị ngược, cô độc có thể thành cô lập: rút lui quá lâu, không chịu ra khỏi hang. Ngọn đèn không còn soi đường, chỉ còn lại cô đơn."},{"k":"m10","n":"Wheel of Fortune","arc":"Major Arcana","sub":"X","up":"Cycles, change, turning point, luck","rv":"Bad luck, resisting change, setbacks","vu":"Chu kỳ, thay đổi, bước ngoặt, vận may","vr":"Vận xui, chống lại thay đổi, trở ngại","d":"Bánh xe lớn có chữ và ký hiệu quay giữa mây. Con rắn đi xuống một bên, thần Anubis đi lên bên kia, nhân sư ngồi trên đỉnh. Bốn góc là bốn sinh vật có cánh đang đọc sách.","lu":"Bánh xe quay giữa mây: mọi thứ đều có chu kỳ. Rắn đi xuống, Anubis đi lên, còn nhân sư ngồi yên trên đỉnh: lên xuống nối nhau, bước ngoặt có thể đến bất cứ lúc nào. Bốn sinh vật có cánh ở bốn góc đang đọc sách như đang ghi lại định mệnh, nên là vận may và thay đổi.","lr":"Ngược lại là lúc bánh xe đang đi xuống: vận xui, trở ngại. Càng chống lại vòng quay thì càng mệt, vì thay đổi không phải thứ bạn kiểm soát được."},{"k":"m11","n":"Justice","arc":"Major Arcana","sub":"XI","up":"Fairness, truth, cause and effect","rv":"Unfairness, dishonesty, avoiding accountability","vu":"Công bằng, sự thật, nhân quả","vr":"Bất công, không trung thực, né trách nhiệm","d":"Người đội vương miện ngồi trên ngai giữa hai cột, tay phải dựng thanh kiếm, tay trái cầm cái cân. Sau lưng là tấm màn tím.","lu":"Cái cân trong tay trái cân nhắc mọi việc, thanh kiếm dựng thẳng trong tay phải cắt rõ đúng sai: đó là công bằng và sự thật. Hai cột đối xứng và tấm màn tím phía sau là trật tự chặt chẽ, nên mọi hành động đều có hệ quả, tức nhân quả.","lr":"Cán cân bị lệch thì thành bất công. Thanh kiếm không dám chặt thì nghĩa là không trung thực hoặc trốn tránh trách nhiệm."},{"k":"m12","n":"The Hanged Man","arc":"Major Arcana","sub":"XII","up":"Pause, surrender, new perspective","rv":"Stalling, resistance, needless sacrifice","vu":"Dừng lại, buông bỏ, góc nhìn mới","vr":"Trì hoãn, kháng cự, hy sinh vô ích","d":"Người đàn ông bị treo ngược một chân vào cây hình chữ T, chân kia gập lại, hai tay giấu sau lưng. Quanh đầu có vầng sáng, nét mặt bình thản.","lu":"Anh bị treo ngược mà vẻ mặt bình thản, quanh đầu có vầng sáng: anh tự nguyện dừng lại, buông bỏ. Nhìn thế giới lộn ngược buộc anh thấy mọi thứ khác đi, đó là góc nhìn mới. Cây treo là cây sống chứ không phải giá treo cổ.","lr":"Bị ngược, sự dừng lại thành trì hoãn: không chịu buông, kháng cự, hoặc hy sinh mà không đổi lại được gì."},{"k":"m13","n":"Death","arc":"Major Arcana","sub":"XIII","up":"Endings, transition, transformation","rv":"Resisting change, stagnation, clinging on","vu":"Kết thúc, chuyển giao, biến đổi","vr":"Chống lại thay đổi, trì trệ, bám víu","d":"Bộ xương mặc giáp cưỡi ngựa trắng, cầm lá cờ đen có hoa hồng trắng. Nhà vua ngã dưới chân ngựa, giáo sĩ và trẻ em đứng quỳ trước mặt. Phía xa, mặt trời mọc giữa hai tháp.","lu":"Bộ xương cưỡi ngựa trắng, cầm cờ có hoa hồng trắng, đi qua mọi người từ vua đến trẻ em: kết thúc đến với tất cả, không thiên vị. Nhưng mặt trời đang mọc giữa hai tháp phía xa, nên đây là chuyển giao, biến đổi chứ không chỉ là mất mát.","lr":"Bị ngược, người ta kháng cự cái kết, ôm chặt thứ đã hết thời nên trì trệ. Mặt trời vẫn mọc nhưng bạn quay lưng với nó."},{"k":"m14","n":"Temperance","arc":"Major Arcana","sub":"XIV","up":"Balance, moderation, patience","rv":"Excess, imbalance, impatience","vu":"Cân bằng, điều độ, kiên nhẫn","vr":"Thái quá, mất cân bằng, nóng vội","d":"Thiên thần có cánh, một chân trong nước, một chân trên đất, rót nước qua lại giữa hai chiếc cốc. Có con đường dẫn lên núi, nơi có ánh sáng như vương miện.","lu":"Thiên thần đứng một chân trong nước, một chân trên đất, rót nước đều đặn giữa hai cốc: cân bằng giữa cảm xúc và thực tế, nên là điều độ. Nước chảy không đổ ra ngoài, và con đường dẫn lên ánh sáng trên núi cho thấy phải đi từ từ, tức kiên nhẫn.","lr":"Nước rót không đều thì thành thái quá hoặc mất cân bằng. Bước đi vội cố rút ngắn con đường nên là nóng vội."},{"k":"m15","n":"The Devil","arc":"Major Arcana","sub":"XV","up":"Attachment, temptation, shadow self","rv":"Breaking free, release, reclaiming power","vu":"Ràng buộc, cám dỗ, mặt tối bản thân","vr":"Thoát ra, giải phóng, lấy lại quyền lực","d":"Quỷ dê có cánh dơi ngồi trên bệ đá. Một nam một nữ trần bị xích vào bệ, nhưng sợi xích đeo lỏng quanh cổ.","lu":"Quỷ dê ngồi cao, hai người trần bị xích vào bệ: bị ràng buộc bởi cám dỗ và nỗi sợ. Nhưng sợi xích đeo lỏng quanh cổ, họ có thể gỡ ra bất cứ lúc nào: ràng buộc do chính mình chọn, nên đó là mặt tối bản thân. Ngọn đuốc và pentagram ngược tượng trưng cho ham muốn vật chất.","lr":"Khi ngược, người ta bắt đầu nhận ra xích đã lỏng và tháo ra: thoát khỏi ràng buộc, lấy lại quyền lực của mình."},{"k":"m16","n":"The Tower","arc":"Major Arcana","sub":"XVI","up":"Sudden upheaval, revelation, collapse","rv":"Fear of change, averted disaster, delayed fall","vu":"Biến cố đột ngột, sự thật phơi bày, sụp đổ","vr":"Sợ thay đổi, tránh được thảm họa, sụp đổ bị hoãn","d":"Tòa tháp trên đỉnh núi bị sét đánh, vương miện bay khỏi nóc, lửa phụt ra từ cửa sổ. Hai người đang rơi xuống.","lu":"Tòa tháp xây trên đỉnh núi bị sét đánh, vương miện văng ra, hai người rơi xuống: những gì xây trên nền sai sẽ sụp. Lửa phụt ra từ cửa sổ là sự thật phơi bày, không thể giấu thêm, nên đây là biến cố đột ngột.","lr":"Ngược lại là sợ thay đổi, hoặc tránh được cú sét lần này nhưng vấn đề vẫn còn đó. Sụp đổ chỉ bị hoãn."},{"k":"m17","n":"The Star","arc":"Major Arcana","sub":"XVII","up":"Hope, renewal, calm, inspiration","rv":"Discouragement, lost faith, disconnection","vu":"Hy vọng, hồi phục, bình yên, cảm hứng","vr":"Nản lòng, mất niềm tin, đứt kết nối","d":"Người phụ nữ trần quỳ bên hồ, đổ nước từ hai bình xuống hồ và xuống đất. Trên trời có ngôi sao lớn tám cánh và bảy ngôi sao nhỏ.","lu":"Người phụ nữ trần quỳ bên hồ, rót nước xuống cả đất lẫn nước: cho đi không giữ lại, mang tính hồi phục. Bầu trời đầy sao sau cơn bão của Tòa Tháp là hy vọng. Không quần áo, không che giấu nghĩa là bình yên và chân thật.","lr":"Ngược lại, nước không được rót: nản lòng, mất niềm tin. Ngôi sao vẫn ở trên trời nhưng bạn không còn nhìn thấy nó."},{"k":"m18","n":"The Moon","arc":"Major Arcana","sub":"XVIII","up":"Illusion, anxiety, uncertainty, intuition","rv":"Fear releasing, confusion lifting, clarity returning","vu":"Ảo tưởng, lo âu, mơ hồ, trực giác","vr":"Nỗi sợ tan dần, sương mù tan, rõ ràng trở lại","d":"Mặt trăng có khuôn mặt chiếu xuống. Một con chó và một con sói tru hai bên con đường, tôm hùm bò lên từ ao. Hai tháp ở phía xa.","lu":"Mặt trăng chiếu ánh sáng mờ, chó và sói tru hai bên đường, tôm hùm bò lên từ ao tối: những thứ ẩn trong vô thức trồi lên, nên là ảo tưởng và lo âu. Con đường mờ giữa hai tháp là mọi thứ chưa rõ, chỉ trực giác dẫn bạn đi tiếp.","lr":"Ngược lại là sương mù đang tan: nỗi sợ nhẹ dần và bạn thấy rõ hơn, dù đôi khi vẫn còn chút bối rối."},{"k":"m19","n":"The Sun","arc":"Major Arcana","sub":"XIX","up":"Joy, success, vitality, clarity","rv":"Temporary gloom, dampened optimism","vu":"Niềm vui, thành công, sức sống, sáng rõ","vr":"U ám tạm thời, lạc quan giảm","d":"Mặt trời lớn có khuôn mặt. Đứa trẻ trần cưỡi ngựa trắng, tay cầm lá cờ đỏ, sau lưng là bức tường và những bông hướng dương.","lu":"Mặt trời lớn chiếu thẳng xuống, đứa trẻ trần cưỡi ngựa trắng vui vẻ: niềm vui trong sáng, sức sống. Bức tường và hoa hướng dương hướng về ánh sáng, không còn gì che giấu, nên là sáng rõ và thành công.","lr":"Bị ngược, mặt trời vẫn đó nhưng bị mây che: u ám tạm thời, lạc quan giảm đi chứ không mất."},{"k":"m20","n":"Judgement","arc":"Major Arcana","sub":"XX","up":"Reckoning, awakening, calling","rv":"Self-doubt, ignoring the call, harsh self-judgement","vu":"Phán xét, thức tỉnh, tiếng gọi","vr":"Tự nghi ngờ, phớt lờ tiếng gọi, tự phán xét gay gắt","d":"Thiên thần thổi kèn trên mây. Người nam, người nữ và đứa trẻ trần đứng dậy từ những quan tài trên mặt nước, dang tay đón nhận.","lu":"Thiên thần thổi kèn, người từ quan tài đứng dậy dang tay: tiếng gọi đánh thức, buộc bạn nhìn lại cả cuộc đời và quyết định sống khác đi, đó là thức tỉnh và phán xét. Cả gia đình cùng đứng lên nghĩa là quá khứ được khép lại.","lr":"Ngược lại là nghe tiếng kèn mà không dậy: phớt lờ tiếng gọi. Hoặc phán xét bản thân quá khắt khe, nên tự nghi ngờ."},{"k":"m21","n":"The World","arc":"Major Arcana","sub":"XXI","up":"Completion, fulfilment, integration","rv":"Unfinished business, delays, lack of closure","vu":"Hoàn tất, viên mãn, hợp nhất","vr":"Dở dang, chậm trễ, thiếu khép lại","d":"Người nhảy múa giữa vòng hoa nguyệt quế, tay cầm hai cây đũa, vải tím quấn quanh người. Bốn góc là thiên thần, đại bàng, bò và sư tử.","lu":"Người nhảy múa giữa vòng nguyệt quế: một chu kỳ khép lại trọn vẹn, nên là hoàn tất, viên mãn. Bốn sinh vật ở bốn góc (bốn nguyên tố) đều có mặt, nghĩa là mọi mảnh ghép đã hợp nhất.","lr":"Ngược lại, vòng hoa còn hở: dở dang, chậm trễ. Chỉ còn một bước cuối nhưng chưa khép lại được."},{"k":"w01","n":"Ace of Wands","arc":"Wands","sub":"","up":"Inspiration, new spark, potential","rv":"Delays, lack of drive","vu":"Cảm hứng, tia lửa mới, tiềm năng","vr":"Trì hoãn, thiếu động lực","d":"Bàn tay từ đám mây nắm cây gậy đang nảy lộc, lá rơi xuống. Phía xa là lâu đài trên đồi xanh.","lu":"Bàn tay từ mây trao cây gậy đang nảy lộc: món quà của một ý tưởng mới, nên là cảm hứng và tiềm năng. Lá non trên gậy là sức sống chưa kịp thành hình, và cảnh đồi xanh phía xa là nơi nó có thể lớn lên.","lr":"Ngược lại, cây gậy không nảy được: trì hoãn, thiếu động lực. Tia lửa có đó nhưng chưa cháy."},{"k":"w02","n":"Two of Wands","arc":"Wands","sub":"","up":"Planning, decisions, future vision","rv":"Fear of the unknown, poor planning","vu":"Lên kế hoạch, quyết định, tầm nhìn tương lai","vr":"Sợ điều chưa biết, kế hoạch kém","d":"Người đàn ông đứng trên tường lâu đài, tay cầm quả cầu, tay kia nắm một cây gậy, bên cạnh có thêm một cây gậy nữa. Anh nhìn ra biển.","lu":"Người đàn ông đứng trên tường lâu đài, quả cầu trong tay, nhìn ra biển xa: đã có chút thành tựu, nay đang suy tính bước tiếp, nên là lên kế hoạch và tầm nhìn tương lai. Hai cây gậy là hai lựa chọn, và anh phải quyết định thay vì ở lại an toàn.","lr":"Ngược lại là không dám rời tường thành: sợ điều chưa biết. Kế hoạch mơ hồ nên chẳng đi đâu."},{"k":"w03","n":"Three of Wands","arc":"Wands","sub":"","up":"Expansion, foresight, progress","rv":"Obstacles, delays, lack of foresight","vu":"Mở rộng, nhìn xa, tiến triển","vr":"Trở ngại, chậm trễ, thiếu tầm nhìn","d":"Người đàn ông đứng quay lưng trên vách đá, ba cây gậy cắm quanh, nhìn ra biển có những chiếc thuyền buồm.","lu":"Anh quay lưng, nhìn thuyền ra khơi từ vách đá: những việc đã gieo giờ đang đi xa, nên là mở rộng và nhìn xa. Ba cây gậy cắm vững dưới chân là nền đã dựng, anh chỉ đợi kết quả quay về.","lr":"Ngược lại, thuyền không ra khơi hoặc không có tầm nhìn, nên là trở ngại và chậm trễ."},{"k":"w04","n":"Four of Wands","arc":"Wands","sub":"","up":"Celebration, harmony, homecoming","rv":"Instability, lack of support, transition","vu":"Ăn mừng, hòa hợp, về nhà","vr":"Bất ổn, thiếu hỗ trợ, giai đoạn chuyển tiếp","d":"Bốn cây gậy kết hoa làm thành cổng vòm. Hai người giơ hoa mừng rỡ, phía sau là lâu đài và đám đông nhảy múa.","lu":"Cổng vòm bốn gậy kết hoa là lễ mừng: đó là ăn mừng và hòa hợp. Hai người giơ hoa chào đón, lâu đài và đám đông phía sau tạo cảm giác về nhà an toàn.","lr":"Ngược lại, cổng chưa dựng xong: bất ổn, thiếu hỗ trợ, hoặc đang trong giai đoạn chuyển tiếp."},{"k":"w05","n":"Five of Wands","arc":"Wands","sub":"","up":"Conflict, competition, tension","rv":"Avoiding conflict, inner conflict, resolution","vu":"Xung đột, cạnh tranh, căng thẳng","vr":"Né xung đột, mâu thuẫn nội tâm, hòa giải","d":"Năm thanh niên đang vung gậy đánh nhau lộn xộn, không ai thắng rõ ràng.","lu":"Năm người vung gậy loạn xạ mà không ai thắng: va chạm, cạnh tranh, bất đồng ý kiến. Không có kẻ thù thật sự, chỉ là mỗi người cố khẳng định mình, nên đó là xung đột và căng thẳng.","lr":"Ngược lại, gậy hạ xuống: né xung đột hoặc dàn xếp. Cũng có thể mâu thuẫn chuyển vào bên trong."},{"k":"w06","n":"Six of Wands","arc":"Wands","sub":"","up":"Victory, recognition, pride","rv":"Ego, fall from grace, no recognition","vu":"Chiến thắng, được công nhận, tự hào","vr":"Cái tôi, sa sút, không được công nhận","d":"Người cưỡi ngựa, đội vòng nguyệt quế, cầm cây gậy buộc vòng hoa chiến thắng. Đám đông cầm gậy đi bộ xung quanh.","lu":"Người cưỡi ngựa đội vòng nguyệt quế, gậy buộc vòng hoa chiến thắng, đám đông vây quanh: được công nhận, tự hào và chiến thắng. Nhưng anh đi giữa đám đông, nên thành công còn phụ thuộc vào sự ủng hộ của người khác.","lr":"Ngược lại là cái tôi phình ra hoặc không ai công nhận. Cũng có thể là sa sút sau khi chiến thắng."},{"k":"w07","n":"Seven of Wands","arc":"Wands","sub":"","up":"Defence, perseverance, standing your ground","rv":"Overwhelmed, giving up, yielding","vu":"Phòng thủ, kiên trì, giữ vững lập trường","vr":"Quá tải, bỏ cuộc, nhượng bộ","d":"Người đứng trên đồi cầm gậy, bị sáu cây gậy chĩa lên từ bên dưới. Hai chiếc giày của anh không giống nhau.","lu":"Anh đứng trên đồi cao, chiến đấu với sáu cây gậy chĩa lên từ bên dưới: giữ vững vị trí bất chấp áp lực, nên là phòng thủ và kiên trì. Hai chiếc giày không giống nhau cho thấy anh vội vã, nhưng vẫn giữ được thế cao hơn.","lr":"Ngược lại, quá tải nên nhượng bộ hoặc bỏ cuộc, để vị trí cao tuột mất."},{"k":"w08","n":"Eight of Wands","arc":"Wands","sub":"","up":"Speed, movement, quick action","rv":"Delays, slowing down, frustration","vu":"Tốc độ, chuyển động, hành động nhanh","vr":"Trì hoãn, chậm lại, bực bội","d":"Tám cây gậy bay chéo trên bầu trời trong, không có người. Phía dưới là đồng quê và dòng sông.","lu":"Tám cây gậy bay song song trên trời trong, không có người cầm: mọi thứ đang chuyển nhanh và đúng hướng, nên là tốc độ và hành động nhanh. Phía dưới yên ả, nghĩa là sau thời gian chờ, mọi việc đột ngột tới cùng lúc.","lr":"Ngược lại, gậy rơi chậm hoặc va nhau: trì hoãn, chậm lại, bực bội vì không tiến nhanh."},{"k":"w09","n":"Nine of Wands","arc":"Wands","sub":"","up":"Resilience, last stand, persistence","rv":"Exhaustion, defensiveness, giving up","vu":"Bền bỉ, nỗ lực cuối, kiên trì","vr":"Kiệt sức, phòng thủ, bỏ cuộc","d":"Người đàn ông băng đầu, vẻ mệt mỏi nhưng cảnh giác, tựa vào cây gậy. Sau lưng là tám cây gậy cắm thành hàng rào.","lu":"Người băng đầu, nhìn lại phía sau, tựa vào gậy: đã trải qua nhiều và còn một nỗ lực cuối. Tám cây gậy cắm thành hàng rào sau lưng là những gì đã vượt qua, nên mang nghĩa bền bỉ và kiên trì.","lr":"Ngược lại, người ấy kiệt sức, phòng thủ quá mức và muốn bỏ cuộc dù đã gần đích."},{"k":"w10","n":"Ten of Wands","arc":"Wands","sub":"","up":"Burden, overload, responsibility","rv":"Letting go, delegating, collapsing under load","vu":"Gánh nặng, quá tải, trách nhiệm","vr":"Buông bớt, ủy thác, gục dưới áp lực","d":"Người đàn ông còng lưng ôm một bó mười cây gậy, đi về phía ngôi nhà ở xa.","lu":"Người còng lưng ôm mười cây gậy đi đến ngôi nhà ở xa: gánh nặng trách nhiệm, tự ôm hết nên quá tải. Anh đã gần tới nơi, nhưng tầm nhìn bị bó gậy che mất.","lr":"Ngược lại, anh đặt bớt xuống: buông bớt, ủy thác. Cũng có thể gánh nặng quá sức khiến anh gục ngã."},{"k":"w11","n":"Page of Wands","arc":"Wands","sub":"","up":"Curiosity, enthusiasm, new ideas","rv":"Impatience, lack of direction","vu":"Tò mò, nhiệt huyết, ý tưởng mới","vr":"Thiếu kiên nhẫn, thiếu định hướng","d":"Chàng trai trẻ đứng giữa sa mạc, nhìn chăm chú cây gậy đang nảy lộc. Áo thêu hình kỳ nhông, kim tự tháp ở xa.","lu":"Chàng trai đứng giữa sa mạc, nhìn kỹ cây gậy mới nảy lộc: tò mò và nhiệt huyết trước điều mới. Áo thêu kỳ nhông (biểu tượng của lửa) cho thấy ngọn lửa đang cháy trong anh, nên là ý tưởng mới.","lr":"Ngược lại, anh không biết nhìn vào đâu: thiếu kiên nhẫn, thiếu định hướng, nhiều ý tưởng nhưng không bắt đầu."},{"k":"w12","n":"Knight of Wands","arc":"Wands","sub":"","up":"Energy, passion, adventure","rv":"Haste, recklessness, burnout","vu":"Năng lượng, đam mê, phiêu lưu","vr":"Vội vàng, liều lĩnh, kiệt sức","d":"Hiệp sĩ mặc giáp cưỡi ngựa đang lồng lên, tay cầm cây gậy nảy lộc. Áo có hình kỳ nhông, sa mạc phía sau.","lu":"Hiệp sĩ phi nước đại, ngựa lồng lên: năng lượng và đam mê, lao vào phiêu lưu. Áo có kỳ nhông (lửa), gậy nảy lộc trong tay, nhưng nền sa mạc không có đường rõ ràng nên anh dựa vào khát khao hơn là kế hoạch.","lr":"Ngược lại, ngựa chạy quá nhanh nên vội vàng, liều lĩnh, và cháy hết năng lượng thành kiệt sức."},{"k":"w13","n":"Queen of Wands","arc":"Wands","sub":"","up":"Confidence, warmth, determination","rv":"Jealousy, demanding, insecurity","vu":"Tự tin, ấm áp, quyết đoán","vr":"Ghen tị, đòi hỏi, bất an","d":"Nữ hoàng ngồi trên ngai có hình sư tử, tay cầm cây gậy và bông hướng dương. Con mèo đen ngồi dưới chân.","lu":"Nữ hoàng ngồi vững vàng, thoải mái trên ngai sư tử, tay cầm gậy và hoa hướng dương: tự tin và ấm áp. Con mèo đen bên chân (trực giác và độc lập) cho thấy bà biết mình là ai, nên là quyết đoán.","lr":"Ngược lại, tự tin thành đòi hỏi, ghen tị với người khác, và đằng sau là bất an."},{"k":"w14","n":"King of Wands","arc":"Wands","sub":"","up":"Leadership, vision, boldness","rv":"Domineering, impulsive, ruthless","vu":"Lãnh đạo, tầm nhìn, táo bạo","vr":"Độc đoán, bốc đồng, tàn nhẫn","d":"Vua ngồi trên ngai khắc sư tử và kỳ nhông, tay cầm cây gậy đang nảy mầm, thân hơi nghiêng về trước.","lu":"Ngai khắc sư tử và kỳ nhông, nhà vua nghiêng người về phía trước: người lãnh đạo có tầm nhìn và dám làm. Cây gậy đang nảy mầm trong tay là ý tưởng ông biến thành hiện thực, nên mang nghĩa lãnh đạo và táo bạo.","lr":"Ngược lại, tầm nhìn thành độc đoán và bốc đồng, và quyền lực dùng sai thành tàn nhẫn."},{"k":"c01","n":"Ace of Cups","arc":"Cups","sub":"","up":"New feelings, love, compassion","rv":"Blocked emotion, emptiness","vu":"Cảm xúc mới, tình yêu, lòng trắc ẩn","vr":"Cảm xúc bị chặn, trống rỗng","d":"Bàn tay từ mây nâng chiếc cốc vàng, chim bồ câu thả bánh thánh vào cốc. Năm dòng nước chảy xuống hồ có hoa sen.","lu":"Bàn tay từ mây nâng chiếc cốc, nước tràn năm dòng xuống hồ, bồ câu thả bánh thánh vào cốc: cảm xúc mới ùa tới và đầy ắp, nên là tình yêu, lòng trắc ẩn. Hoa sen trên mặt hồ là sự khai mở của trái tim.","lr":"Ngược lại, cốc không đầy hoặc không đón được dòng nước: cảm xúc bị chặn, trống rỗng."},{"k":"c02","n":"Two of Cups","arc":"Cups","sub":"","up":"Partnership, mutual attraction, connection","rv":"Imbalance, broken bond, miscommunication","vu":"Đối tác, hấp dẫn hai chiều, kết nối","vr":"Mất cân bằng, đổ vỡ, hiểu lầm","d":"Một nam một nữ đối mặt và trao nhau hai chiếc cốc. Phía trên là cây gậy có cánh quấn rắn và đầu sư tử.","lu":"Hai người đối mặt, trao cốc cho nhau: kết nối hai chiều, đối tác. Cây gậy cánh với đầu sư tử phía trên là sức mạnh của mối quan hệ, nên đây là sự hấp dẫn bình đẳng và tôn trọng.","lr":"Ngược lại, cốc không còn được trao đều: mất cân bằng, đổ vỡ, hiểu lầm."},{"k":"c03","n":"Three of Cups","arc":"Cups","sub":"","up":"Friendship, celebration, community","rv":"Overindulgence, gossip, isolation","vu":"Tình bạn, ăn mừng, cộng đồng","vr":"Thái quá, đàm tiếu, cô lập","d":"Ba cô gái đội vòng hoa nhảy múa, cùng giơ cao ba chiếc cốc. Trái cây và rau củ nằm dưới chân.","lu":"Ba cô gái nhảy múa, giơ cốc: niềm vui chung, nên là tình bạn và ăn mừng. Trái cây dưới chân là mùa thu hoạch cùng nhau.","lr":"Ngược lại, vui thành quá đà, đàm tiếu sau lưng, hoặc cảm thấy bị loại khỏi nhóm."},{"k":"c04","n":"Four of Cups","arc":"Cups","sub":"","up":"Apathy, contemplation, reevaluation","rv":"New offers noticed, motivation returns, withdrawal","vu":"Thờ ơ, trầm tư, đánh giá lại","vr":"Nhận ra cơ hội mới, động lực trở lại, thu mình","d":"Người ngồi khoanh tay dưới gốc cây, ba chiếc cốc trước mặt. Một bàn tay từ mây đưa ra chiếc cốc thứ tư mà anh chưa để ý.","lu":"Người khoanh tay, nhìn xuống ba cốc: trầm tư và đánh giá lại những gì mình có. Anh quay lưng với chiếc cốc thứ tư từ bàn tay trên mây, nghĩa là thờ ơ: mải nghĩ nên không thấy cơ hội mới.","lr":"Ngược lại, anh ngẩng đầu thấy cốc thứ tư: nhận ra cơ hội, động lực trở lại. Nếu không, vẫn thu mình."},{"k":"c05","n":"Five of Cups","arc":"Cups","sub":"","up":"Loss, grief, regret","rv":"Acceptance, moving on, finding peace","vu":"Mất mát, đau buồn, tiếc nuối","vr":"Chấp nhận, bước tiếp, tìm bình yên","d":"Người mặc áo choàng đen cúi đầu nhìn ba chiếc cốc đổ. Sau lưng còn hai chiếc cốc đứng nhưng anh không thấy. Có dòng sông và cây cầu.","lu":"Người mặc áo choàng đen cúi nhìn ba cốc đổ: mất mát và đau buồn. Nhưng sau lưng còn hai cốc đứng, anh chưa quay lại nhìn nên chìm trong tiếc nuối. Cây cầu và dòng sông là con đường để tiếp tục.","lr":"Ngược lại, anh quay lại thấy hai cốc còn đứng: chấp nhận, bước tiếp, tìm bình yên."},{"k":"c06","n":"Six of Cups","arc":"Cups","sub":"","up":"Nostalgia, memories, innocence","rv":"Stuck in the past, unrealistic nostalgia","vu":"Hoài niệm, ký ức, ngây thơ","vr":"Mắc kẹt quá khứ, hoài niệm phi thực tế","d":"Hai đứa trẻ trong sân làng, một bé đưa cho bé kia chiếc cốc đầy hoa. Các cốc khác cũng đầy hoa.","lu":"Hai đứa trẻ trong sân nhà, một bé tặng bé kia cốc đầy hoa: ký ức tuổi thơ, hoài niệm và ngây thơ. Hoa trong cốc là sự tử tế đơn giản, nhưng không gian khép kín cho thấy nó thuộc về quá khứ.","lr":"Ngược lại, bám vào quá khứ: hoài niệm thành mắc kẹt, tô hồng thứ không còn."},{"k":"c07","n":"Seven of Cups","arc":"Cups","sub":"","up":"Choices, fantasy, illusion","rv":"Clarity, a real choice, decision made","vu":"Nhiều lựa chọn, mơ mộng, ảo tưởng","vr":"Sáng rõ, lựa chọn thật, đã quyết định","d":"Bóng người nhìn bảy chiếc cốc trôi trên mây, mỗi cốc chứa một thứ: người, rắn, lâu đài, ngọc, vòng nguyệt quế, rồng.","lu":"Bóng người nhìn bảy cốc trôi trên mây, mỗi cốc chứa một thứ: người, rắn, lâu đài, ngọc, vòng nguyệt quế, rồng: quá nhiều lựa chọn lung linh, nên là mơ mộng và ảo tưởng. Cốc nào cũng hấp dẫn nhưng chưa cốc nào có thật.","lr":"Ngược lại, mây tan: sáng rõ, chọn được một lựa chọn thật và quyết định."},{"k":"c08","n":"Eight of Cups","arc":"Cups","sub":"","up":"Walking away, seeking more, leaving","rv":"Fear of leaving, aimless drifting, staying put","vu":"Bỏ đi, tìm điều hơn, rời khỏi","vr":"Sợ rời đi, trôi dạt, ở lại","d":"Người cầm gậy quay lưng bước đi trong đêm trăng, bỏ lại tám chiếc cốc xếp gọn. Con đường dẫn qua núi đá.","lu":"Anh quay lưng bước đi giữa đêm trăng, bỏ lại tám cốc xếp ngay ngắn: những gì có vẫn đầy đặn nhưng không còn làm anh thỏa mãn, nên là rời đi, tìm điều hơn. Con đường qua núi là hành trình tìm ý nghĩa.","lr":"Ngược lại, anh sợ rời đi, ở lại dù không còn hợp, hoặc đi mà không biết đi đâu."},{"k":"c09","n":"Nine of Cups","arc":"Cups","sub":"","up":"Wish fulfilled, contentment, satisfaction","rv":"Smugness, dissatisfaction, materialism","vu":"Điều ước thành, hài lòng, mãn nguyện","vr":"Tự mãn, bất mãn, vật chất","d":"Người đàn ông đội mũ đỏ ngồi khoanh tay, vẻ hài lòng. Sau lưng là chín chiếc cốc xếp trên bàn cong.","lu":"Người đàn ông ngồi khoanh tay, mặt hài lòng, sau lưng là chín cốc xếp thành hàng: điều ước đã thành, sự mãn nguyện. Dáng ngồi thoải mái cho thấy anh biết mình đã có đủ.","lr":"Ngược lại, hài lòng thành tự mãn, hoặc có nhiều mà vẫn thấy thiếu: bất mãn, chạy theo vật chất."},{"k":"c10","n":"Ten of Cups","arc":"Cups","sub":"","up":"Family harmony, emotional fulfilment","rv":"Disconnection, broken home, misaligned values","vu":"Gia đình hòa thuận, viên mãn cảm xúc","vr":"Xa cách, gia đình rạn nứt, lệch giá trị","d":"Cặp đôi dang tay hướng lên cầu vồng có mười chiếc cốc, hai đứa trẻ nhảy múa. Có ngôi nhà nhỏ và cây cối.","lu":"Cầu vồng mười cốc trên trời, cặp đôi dang tay, hai đứa trẻ nhảy múa trước ngôi nhà: gia đình hòa thuận và viên mãn cảm xúc. Mọi người cùng nhìn lên một hướng, nên là giá trị chung.","lr":"Ngược lại, cầu vồng mờ: xa cách, gia đình rạn nứt hoặc mỗi người một giá trị."},{"k":"c11","n":"Page of Cups","arc":"Cups","sub":"","up":"Curiosity, creative message, sensitivity","rv":"Immaturity, emotional insecurity","vu":"Tò mò, thông điệp sáng tạo, nhạy cảm","vr":"Non nớt, bất an cảm xúc","d":"Chàng trai áo hoa đứng cạnh biển, tay cầm chiếc cốc có con cá thò đầu ra nhìn anh.","lu":"Chàng trai bên biển nhìn con cá thò đầu ra khỏi cốc: một thông điệp bất ngờ từ vô thức, nên là sáng tạo và nhạy cảm. Vẻ mặt anh tò mò, không sợ.","lr":"Ngược lại, anh bối rối trước thông điệp: non nớt, bất an cảm xúc."},{"k":"c12","n":"Knight of Cups","arc":"Cups","sub":"","up":"Romance, charm, imagination","rv":"Moodiness, unrealistic, disappointment","vu":"Lãng mạn, quyến rũ, giàu tưởng tượng","vr":"Thất thường, phi thực tế, thất vọng","d":"Hiệp sĩ cưỡi ngựa trắng đi chậm, hai tay nâng chiếc cốc. Mũ và giày có cánh, bên cạnh có dòng sông.","lu":"Hiệp sĩ cưỡi ngựa trắng đi chậm, nâng cốc bằng cả hai tay như dâng một lời đề nghị: lãng mạn và quyến rũ. Mũ và giày có cánh là trí tưởng tượng bay xa.","lr":"Ngược lại, lời đề nghị nghe hay nhưng phi thực tế: thất thường, rồi thất vọng."},{"k":"c13","n":"Queen of Cups","arc":"Cups","sub":"","up":"Compassion, intuition, emotional security","rv":"Emotional insecurity, martyrdom, oversensitive","vu":"Thấu cảm, trực giác, an toàn cảm xúc","vr":"Bất an cảm xúc, hy sinh quá mức, quá nhạy cảm","d":"Nữ hoàng ngồi trên ngai bên bờ biển, ngắm chiếc cốc có nắp đậy chạm khắc công phu.","lu":"Nữ hoàng ngồi bên bờ biển, nhìn chiếc cốc có nắp, đậy kín: hiểu cảm xúc sâu nhưng không để chúng tràn ra. Sóng vỗ nhẹ dưới chân là sự an toàn cảm xúc, nên là thấu cảm và trực giác.","lr":"Ngược lại, sóng tràn vào: bất an, quá nhạy cảm, hy sinh bản thân vì người khác."},{"k":"c14","n":"King of Cups","arc":"Cups","sub":"","up":"Emotional balance, diplomacy, wisdom","rv":"Manipulation, moodiness, repression","vu":"Cân bằng cảm xúc, khéo léo, khôn ngoan","vr":"Thao túng, thất thường, kìm nén","d":"Vua ngồi trên ngai nổi giữa biển động, một tay cầm cốc, tay kia cầm quyền trượng. Có cá nhảy và thuyền ở xa.","lu":"Vua ngồi trên ngai nổi giữa biển động mà vẫn bình thản: cầm cảm xúc trong tay mà không bị cuốn đi, nên là cân bằng và khôn ngoan. Con cá nhảy phía sau là cảm xúc sống động nhưng được kiểm soát.","lr":"Ngược lại, cảm xúc bị nén xuống, hoặc dùng cảm xúc để thao túng: biển động nhưng vua giả vờ yên."},{"k":"s01","n":"Ace of Swords","arc":"Swords","sub":"","up":"Clarity, truth, breakthrough","rv":"Confusion, clouded judgement, brutality","vu":"Sáng rõ, sự thật, đột phá","vr":"Rối ren, phán đoán mờ, thô bạo","d":"Bàn tay từ mây cầm thanh kiếm dựng đứng, mũi kiếm xuyên qua vương miện và vòng nguyệt quế. Núi đá phía dưới.","lu":"Bàn tay từ mây cầm kiếm dựng thẳng, mũi kiếm xuyên qua vương miện và vòng nguyệt quế: suy nghĩ sáng suốt thắng mọi nhiễu loạn, nên là sáng rõ, sự thật, đột phá. Lưỡi kiếm cắt qua mọi mơ hồ.","lr":"Ngược lại, kiếm bị cầm sai: rối ren, phán đoán mờ, hoặc nói thẳng đến thô bạo."},{"k":"s02","n":"Two of Swords","arc":"Swords","sub":"","up":"Stalemate, difficult choice, blocked emotions","rv":"Indecision, information overload, no right choice","vu":"Bế tắc, lựa chọn khó, cảm xúc bị chặn","vr":"Do dự, quá tải thông tin, không có lựa chọn đúng","d":"Người phụ nữ bị bịt mắt ngồi trên ghế đá bên mặt nước, hai tay dang chéo giữ hai thanh kiếm. Trăng lưỡi liềm trên trời.","lu":"Người bị bịt mắt ngồi yên, hai kiếm chéo trước ngực, sau lưng là mặt nước: không nhìn và không muốn quyết định, nên là bế tắc. Hai kiếm cân bằng nhau nghĩa là lựa chọn khó, cảm xúc bị chặn lại.","lr":"Ngược lại, khăn bịt mắt tuột ra nhưng bị quá tải thông tin: do dự, hoặc không có lựa chọn đúng."},{"k":"s03","n":"Three of Swords","arc":"Swords","sub":"","up":"Heartbreak, grief, pain","rv":"Recovery, forgiveness, releasing pain","vu":"Tan vỡ, đau buồn, nỗi đau","vr":"Hồi phục, tha thứ, buông nỗi đau","d":"Một trái tim đỏ bị ba thanh kiếm đâm xuyên, nền trời mây xám và mưa.","lu":"Trái tim đỏ bị ba kiếm đâm trong cơn mưa: nỗi đau rõ ràng và không giấu, nên là tan vỡ và đau buồn. Không có người, chỉ có trái tim, nghĩa là nỗi đau này phải được cảm nhận.","lr":"Ngược lại, kiếm được rút ra: hồi phục, tha thứ, và buông nỗi đau."},{"k":"s04","n":"Four of Swords","arc":"Swords","sub":"","up":"Rest, recovery, contemplation","rv":"Burnout, restlessness, returning to action","vu":"Nghỉ ngơi, hồi phục, chiêm nghiệm","vr":"Kiệt sức, bồn chồn, quay lại hành động","d":"Hiệp sĩ nằm trên quan tài đá, hai tay chắp, ba thanh kiếm treo trên tường và một thanh nằm dưới. Có cửa sổ kính màu.","lu":"Hiệp sĩ nằm trên quan tài đá, tay chắp: tạm dừng chiến đấu, nghỉ ngơi và hồi phục. Kiếm treo trên tường nhắc rằng cuộc chiến vẫn còn, nhưng cửa sổ kính màu cho thấy đây là lúc chiêm nghiệm.","lr":"Ngược lại, anh ngồi dậy quá sớm hoặc không ngủ được: kiệt sức, bồn chồn, sắp quay lại hành động."},{"k":"s05","n":"Five of Swords","arc":"Swords","sub":"","up":"Conflict, defeat, winning at a cost","rv":"Reconciliation, regret, moving on","vu":"Xung đột, thất bại, thắng nhưng phải trả giá","vr":"Hòa giải, hối tiếc, bước tiếp","d":"Người cười đắc thắng cầm ba thanh kiếm, hai người khác bỏ đi tay không phía xa, kiếm vứt dưới đất. Trời đầy mây.","lu":"Người cười đắc thắng cầm ba kiếm, hai người kia bỏ đi tay không: thắng nhưng bằng cách khiến người khác thua, nên là xung đột, thắng mà phải trả giá. Trời đầy mây nhắc rằng chiến thắng này không vui trọn vẹn.","lr":"Ngược lại là hối tiếc sau trận, hoặc hòa giải và bước tiếp, không tiếp tục hơn thua."},{"k":"s06","n":"Six of Swords","arc":"Swords","sub":"","up":"Transition, moving on, calmer waters","rv":"Stuck, unresolved baggage, resistance","vu":"Chuyển tiếp, bước tiếp, nước lặng hơn","vr":"Mắc kẹt, gánh nặng chưa giải quyết, kháng cự","d":"Người chèo thuyền đưa một phụ nữ trùm đầu và đứa trẻ qua sông, thuyền chở sáu thanh kiếm cắm đứng. Một bên nước đục, bên kia nước phẳng.","lu":"Người chèo thuyền đưa hai người trùm đầu rời vùng nước đục sang vùng nước phẳng: chuyển tiếp, bước tiếp tới nơi yên hơn. Sáu kiếm trong thuyền là gánh nặng họ mang theo, và họ vẫn tiến.","lr":"Ngược lại, thuyền không rời bờ: mắc kẹt, gánh nặng chưa giải quyết, kháng cự việc đi."},{"k":"s07","n":"Seven of Swords","arc":"Swords","sub":"","up":"Deception, strategy, sneaking","rv":"Confession, getting caught, conscience","vu":"Lừa dối, chiến lược, lén lút","vr":"Thú nhận, bị phát hiện, lương tâm","d":"Người đàn ông rón rén rời trại, ôm năm thanh kiếm, để lại hai thanh cắm trên đất. Phía sau là lều lính.","lu":"Anh rón rén rời trại mang năm kiếm, bỏ hai kiếm lại: lén lút, dùng chiến lược. Lều lính phía sau cho thấy anh trốn ai đó, nên đó là lừa dối hoặc né tránh.","lr":"Ngược lại, kế hoạch lộ ra: thú nhận, bị phát hiện, hoặc lương tâm không yên."},{"k":"s08","n":"Eight of Swords","arc":"Swords","sub":"","up":"Feeling trapped, self-imposed limits, restriction","rv":"Freeing yourself, new perspective, self-acceptance","vu":"Cảm thấy bị mắc kẹt, tự giới hạn, bó buộc","vr":"Tự giải thoát, góc nhìn mới, tự chấp nhận","d":"Người phụ nữ bị bịt mắt, quấn dây quanh người, đứng giữa tám thanh kiếm cắm quanh. Mặt đất ngập nước, lâu đài ở xa.","lu":"Người phụ nữ bị bịt mắt, quấn dây nhẹ, quanh người là tám kiếm, mặt đất ngập nước: cảm thấy bị mắc kẹt. Nhưng dây lỏng và không có rào chắn thật, chỉ là tự giới hạn bằng suy nghĩ.","lr":"Ngược lại, dây tuột ra: tự giải thoát, nhìn từ góc nhìn mới, tự chấp nhận."},{"k":"s09","n":"Nine of Swords","arc":"Swords","sub":"","up":"Anxiety, worry, sleepless nights","rv":"Hope, reaching out, releasing worry","vu":"Lo âu, trăn trở, mất ngủ","vr":"Hy vọng, tìm người giúp, buông lo lắng","d":"Người ngồi dậy giữa đêm trên giường, hai tay ôm mặt. Chín thanh kiếm treo trên tường, chăn thêu hoa hồng.","lu":"Người ngồi bật dậy giữa đêm, hai tay ôm mặt, chín kiếm treo trên tường: lo âu, trăn trở, mất ngủ. Kiếm không chạm vào người, nên nỗi sợ nằm trong đầu nhiều hơn ngoài đời.","lr":"Ngược lại, nỗi lo giảm đi: hy vọng, mở lòng tìm giúp đỡ, buông lo lắng."},{"k":"s10","n":"Ten of Swords","arc":"Swords","sub":"","up":"Painful ending, rock bottom, betrayal","rv":"Recovery, resisting an end, regeneration","vu":"Kết thúc đau đớn, chạm đáy, phản bội","vr":"Hồi phục, chống lại kết thúc, tái sinh","d":"Người nằm sấp, mười thanh kiếm cắm trên lưng. Trời đen nhưng phía chân trời có ánh bình minh.","lu":"Người nằm sấp, mười kiếm cắm trên lưng, trời đen: đau đớn tột cùng, chạm đáy, như bị phản bội. Nhưng phía chân trời có ánh bình minh: không thể tệ hơn nữa, nên đây là kết thúc để mở ra điều mới.","lr":"Ngược lại là bắt đầu hồi phục, hoặc không chịu chấp nhận cái kết nên kéo dài đau khổ."},{"k":"s11","n":"Page of Swords","arc":"Swords","sub":"","up":"Curiosity, new ideas, vigilance","rv":"All talk, haste, scattered thinking","vu":"Tò mò, ý tưởng mới, cảnh giác","vr":"Nói nhiều làm ít, vội vã, tản mạn","d":"Chàng trai đứng trên đồi gió, hai tay nâng kiếm cao. Mây cuồn cuộn, chim bay trên trời.","lu":"Chàng trai đứng trên đồi gió, nâng kiếm cao: cảnh giác, tò mò và đầy ý tưởng. Mây cuồn cuộn và gió mạnh là đầu óc đang chạy không ngừng.","lr":"Ngược lại, nói nhiều làm ít, vội vã, suy nghĩ tản mạn."},{"k":"s12","n":"Knight of Swords","arc":"Swords","sub":"","up":"Ambition, fast action, drive","rv":"Impulsive, no direction, aggressive","vu":"Tham vọng, hành động nhanh, quyết liệt","vr":"Bốc đồng, thiếu hướng đi, hung hăng","d":"Hiệp sĩ phi nước đại trên ngựa trắng, kiếm giơ cao. Cây cối bị gió thổi nghiêng, mây cuồn cuộn.","lu":"Hiệp sĩ phi nước đại, kiếm giơ cao, cây cối nghiêng vì gió: tham vọng và hành động nhanh. Anh lao thẳng vào mục tiêu như một cơn gió.","lr":"Ngược lại, lao đi mà không có hướng: bốc đồng, hung hăng, làm đau người khác."},{"k":"s13","n":"Queen of Swords","arc":"Swords","sub":"","up":"Independence, clear thinking, honesty","rv":"Cold, bitter, overly harsh","vu":"Độc lập, tư duy rõ, thẳng thắn","vr":"Lạnh lùng, cay đắng, quá khắc nghiệt","d":"Nữ hoàng ngồi trên ngai cao, một tay dựng kiếm, tay kia đưa ra phía trước. Nét mặt nghiêm nghị, trời thoáng có mây.","lu":"Nữ hoàng ngồi thẳng, một tay dựng kiếm, tay kia đưa ra: nhìn thẳng sự thật, độc lập, tư duy rõ ràng. Trời cao và thoáng cho thấy bà nhìn xa, nên là thẳng thắn.","lr":"Ngược lại, thẳng thắn thành lạnh lùng, cay đắng, quá khắc nghiệt."},{"k":"s14","n":"King of Swords","arc":"Swords","sub":"","up":"Intellect, authority, truth","rv":"Manipulative, cruel, abuse of power","vu":"Trí tuệ, quyền uy, sự thật","vr":"Thao túng, tàn nhẫn, lạm quyền","d":"Vua ngồi thẳng trên ngai, tay cầm thanh kiếm dựng đứng, áo choàng xanh. Trên ngai khắc hình bướm và trăng.","lu":"Vua ngồi thẳng, kiếm dựng trong tay, trên ngai khắc bướm và trăng: lý trí và quyền uy dựa trên sự thật và trí tuệ. Ông phán xét bằng logic, không bằng cảm xúc.","lr":"Ngược lại, trí tuệ dùng để thao túng, quyền uy thành tàn nhẫn, lạm quyền."},{"k":"p01","n":"Ace of Pentacles","arc":"Pentacles","sub":"","up":"Opportunity, prosperity, new venture","rv":"Lost chance, scarcity, poor planning","vu":"Cơ hội, thịnh vượng, khởi nghiệp mới","vr":"Lỡ cơ hội, thiếu thốn, kế hoạch kém","d":"Bàn tay từ mây nâng đồng xu có ngôi sao lớn. Bên dưới là khu vườn nở hoa, cổng vòm hoa và núi.","lu":"Bàn tay từ mây nâng đồng xu có ngôi sao lớn, bên dưới là khu vườn nở rộ: cơ hội cụ thể, sẵn sàng bắt đầu, nên là thịnh vượng và khởi nghiệp. Cổng vòm hoa dẫn ra núi, nghĩa là con đường đã mở.","lr":"Ngược lại, đồng xu rơi mất: lỡ cơ hội, thiếu thốn hoặc kế hoạch kém."},{"k":"p02","n":"Two of Pentacles","arc":"Pentacles","sub":"","up":"Balancing priorities, adaptability","rv":"Overwhelmed, disorganised, losing balance","vu":"Cân bằng ưu tiên, linh hoạt","vr":"Quá tải, thiếu tổ chức, mất cân bằng","d":"Chàng trai nhảy múa tung hai đồng xu nối bằng vòng vô cực. Sau lưng là sóng biển lớn và hai con thuyền.","lu":"Anh vừa nhảy múa vừa tung hai đồng xu nối bằng vòng vô cực, sau lưng sóng lớn: xoay xở nhiều việc cùng lúc, nên là cân bằng ưu tiên, linh hoạt. Sóng cho thấy hoàn cảnh luôn đổi.","lr":"Ngược lại, đồng xu rơi: quá tải, thiếu tổ chức, mất cân bằng."},{"k":"p03","n":"Three of Pentacles","arc":"Pentacles","sub":"","up":"Teamwork, craftsmanship, collaboration","rv":"Lack of teamwork, disorganised, poor quality","vu":"Làm việc nhóm, tay nghề, hợp tác","vr":"Thiếu phối hợp, thiếu tổ chức, chất lượng kém","d":"Người thợ đá đứng trên bàn làm việc trong nhà thờ, hai người cầm bản vẽ bàn bạc với anh. Ba đồng xu khắc trên vòm.","lu":"Người thợ đứng trên bàn thợ trong nhà thờ, hai người cầm bản vẽ góp ý: mỗi người một vai trong cùng một công trình, nên là làm việc nhóm và tay nghề. Ba đồng xu khắc trên vòm là kết quả của sự hợp tác.","lr":"Ngược lại, không ai nghe ai: thiếu phối hợp, thiếu tổ chức, chất lượng kém."},{"k":"p04","n":"Four of Pentacles","arc":"Pentacles","sub":"","up":"Saving, security, control","rv":"Greed, hoarding, loosening the grip","vu":"Tiết kiệm, an toàn, kiểm soát","vr":"Tham lam, tích trữ, nới lỏng tay","d":"Người đội vương miện ngồi, ôm một đồng xu trước ngực, một đồng trên đầu, hai đồng dưới chân. Thành phố phía sau.","lu":"Người ngồi ôm đồng xu trước ngực, một đồng trên đầu, hai dưới chân: giữ chặt không buông, nên là tiết kiệm, an toàn và kiểm soát. Thành phố sau lưng, anh tách khỏi nó, nên sự an toàn đó cũng cô lập.","lr":"Ngược lại, giữ chặt thành tham lam, tích trữ. Hoặc anh bắt đầu nới tay, cho đi."},{"k":"p05","n":"Five of Pentacles","arc":"Pentacles","sub":"","up":"Hardship, isolation, money worries","rv":"Recovery, improvement, finding help","vu":"Khó khăn, cô lập, lo tiền bạc","vr":"Hồi phục, cải thiện, tìm được giúp đỡ","d":"Hai người nghèo, một người chống nạng, đi trong tuyết trước cửa sổ nhà thờ sáng đèn có năm đồng xu.","lu":"Hai người nghèo đi trong tuyết, một người chống nạng, ngang qua cửa sổ nhà thờ sáng đèn: khó khăn, cô lập, lo tiền bạc. Ánh sáng và nơi trú ngay đó nhưng họ chưa nhìn thấy, nên sự giúp đỡ vẫn gần.","lr":"Ngược lại, họ vào được nhà thờ: hồi phục, cải thiện, tìm được giúp đỡ."},{"k":"p06","n":"Six of Pentacles","arc":"Pentacles","sub":"","up":"Generosity, giving and receiving, charity","rv":"Debt, strings attached, one-sided","vu":"Hào phóng, cho và nhận, từ thiện","vr":"Nợ nần, có điều kiện kèm theo, một chiều","d":"Người thương gia giàu có cầm cân, bố thí tiền cho hai người ăn xin quỳ trước mặt. Sáu đồng xu ở trên cao.","lu":"Thương gia giàu có cầm cân, bố thí cho hai người quỳ: cho và nhận, hào phóng. Chiếc cân là sự cân nhắc ai nhận bao nhiêu, nên có cả sự cân bằng trong việc cho.","lr":"Ngược lại, cán cân lệch: có nợ, cho nhưng kèm điều kiện, một chiều."},{"k":"p07","n":"Seven of Pentacles","arc":"Pentacles","sub":"","up":"Patience, long-term view, assessment","rv":"Impatience, poor reward, lack of vision","vu":"Kiên nhẫn, tầm nhìn dài hạn, đánh giá","vr":"Thiếu kiên nhẫn, thành quả kém, thiếu tầm nhìn","d":"Người nông dân chống cuốc nghỉ tay, nhìn bụi cây có bảy đồng xu mọc như quả.","lu":"Người nông dân chống cuốc, nhìn bụi cây có bảy đồng xu: dừng tay đánh giá thành quả, kiên nhẫn chờ mùa gặt. Ánh nhìn dài nghĩa là tầm nhìn dài hạn.","lr":"Ngược lại, thiếu kiên nhẫn muốn hái ngay, thấy thành quả ít, hoặc không có tầm nhìn."},{"k":"p08","n":"Eight of Pentacles","arc":"Pentacles","sub":"","up":"Skill building, diligence, mastery","rv":"Perfectionism, lack of focus, uninspired","vu":"Rèn kỹ năng, chăm chỉ, tinh thông","vr":"Cầu toàn, thiếu tập trung, mất hứng","d":"Người thợ ngồi chăm chú khắc đồng xu trên bàn làm việc. Các đồng đã khắc xong được xếp thành hàng. Ngôi nhà ở xa.","lu":"Người thợ ngồi cặm cụi khắc đồng xu, bên cạnh là các đồng đã xong: chăm chỉ, luyện từng bước để tinh thông. Không ai đứng cạnh, chỉ có anh với công việc, nên là kỷ luật và tay nghề.","lr":"Ngược lại, cầu toàn, khắc mãi không xong, hoặc làm cho có, mất hứng và thiếu tập trung."},{"k":"p09","n":"Nine of Pentacles","arc":"Pentacles","sub":"","up":"Independence, luxury, self-sufficiency","rv":"Over-reliance, financial setbacks, showy","vu":"Độc lập, sung túc, tự lực","vr":"Phụ thuộc, thất thoát tài chính, phô trương","d":"Người phụ nữ áo vàng thêu nho đứng giữa vườn nho, trên tay có chim ưng đội mũ trùm. Chín đồng xu trong vườn.","lu":"Người phụ nữ đứng giữa vườn nho, trên tay có chim ưng đội mũ trùm (đã thuần): tự mình gây dựng nên sung túc và độc lập. Nho chín và áo vàng là thành quả, nên là tự lực và hưởng thụ.","lr":"Ngược lại, phụ thuộc vào người khác hoặc thất thoát, và sự sung túc chỉ là phô trương."},{"k":"p10","n":"Ten of Pentacles","arc":"Pentacles","sub":"","up":"Legacy, wealth, family, long-term success","rv":"Family disputes, financial loss, fragile foundations","vu":"Di sản, giàu có, gia đình, thành công lâu dài","vr":"Tranh chấp gia đình, mất mát tài chính, nền tảng mong manh","d":"Ông lão ngồi cùng chú chó, cặp đôi và đứa trẻ dưới cổng vòm. Lâu đài phía sau, mười đồng xu xếp thành hình Cây Sự Sống.","lu":"Ba thế hệ dưới cổng vòm, lâu đài và chú chó, mười đồng xu xếp thành Cây Sự Sống: sự giàu có truyền qua nhiều đời, nên là di sản và thành công dài hạn. Ông lão ngồi quan sát là nền tảng của gia đình.","lr":"Ngược lại, nền tảng lung lay: tranh chấp gia đình, mất mát tài chính."},{"k":"p11","n":"Page of Pentacles","arc":"Pentacles","sub":"","up":"Ambition, study, new opportunity","rv":"Procrastination, lack of progress","vu":"Tham vọng, học hỏi, cơ hội mới","vr":"Trì hoãn, thiếu tiến triển","d":"Chàng trai trẻ đứng giữa cánh đồng, nâng đồng xu lên ngắm kỹ. Đất đã được cày, có đồi cây phía xa.","lu":"Chàng trai đứng giữa cánh đồng, nâng đồng xu lên ngắm: học hỏi, chú ý từng chi tiết, nên là tham vọng và cơ hội mới. Đất đã cày sẵn nghĩa là anh chuẩn bị kỹ.","lr":"Ngược lại, mải ngắm mà không làm: trì hoãn, thiếu tiến triển."},{"k":"p12","n":"Knight of Pentacles","arc":"Pentacles","sub":"","up":"Reliability, routine, hard work","rv":"Boredom, stagnation, perfectionism","vu":"Đáng tin, nề nếp, chăm chỉ","vr":"Nhàm chán, trì trệ, cầu toàn","d":"Hiệp sĩ ngồi yên trên ngựa đen đứng im, tay cầm đồng xu. Cánh đồng cày phía sau.","lu":"Hiệp sĩ ngồi yên trên con ngựa đứng im, nhìn đồng xu: đáng tin, làm việc đều đặn. Cánh đồng cày xung quanh là công việc lặp lại mà vững chắc, nên là nề nếp và chăm chỉ.","lr":"Ngược lại, đứng yên thành trì trệ, nhàm chán, hoặc cầu toàn không dám bước."},{"k":"p13","n":"Queen of Pentacles","arc":"Pentacles","sub":"","up":"Nurturing, practical, abundant","rv":"Self-neglect, smothering, work-life imbalance","vu":"Chăm sóc, thực tế, dồi dào","vr":"Bỏ bê bản thân, bao bọc quá mức, mất cân bằng công việc–cuộc sống","d":"Nữ hoàng ngồi trên ngai trong vườn hoa nở, hai tay ôm đồng xu trong lòng. Con thỏ nhỏ ở bên cạnh.","lu":"Nữ hoàng ngồi trong vườn hoa, ôm đồng xu trong lòng, thỏ bên cạnh: chăm sóc thực tế, dồi dào. Vườn nở hoa nghĩa là bà biết biến vật chất thành sự ấm áp cho người khác.","lr":"Ngược lại, chăm người khác mà bỏ bê bản thân, bao bọc quá mức, mất cân bằng công việc và đời sống."},{"k":"p14","n":"King of Pentacles","arc":"Pentacles","sub":"","up":"Wealth, security, discipline","rv":"Greed, stubbornness, indulgence","vu":"Giàu có, an toàn, kỷ luật","vr":"Tham lam, cứng đầu, buông thả","d":"Vua ngồi trên ngai khắc nho và đầu bò, một tay cầm quyền trượng, tay kia đỡ đồng xu trong lòng. Lâu đài phía sau.","lu":"Vua ngồi trên ngai khắc nho và đầu bò, đồng xu trong lòng, lâu đài sau lưng: giàu có đến từ kỷ luật bền bỉ, nên là an toàn và vững chắc. Ông thoải mái nhưng không lười.","lr":"Ngược lại, giàu có thành tham lam, cứng đầu, hoặc buông thả."}];
